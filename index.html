<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LectorIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .screen { background: white; border-radius: 20px; padding: 1.5rem; max-width: 480px; width: 100%; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #1e40af; }
    .level { font-size: 12px; background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
    .mascot { text-align: center; font-size: 40px; margin-bottom: 0.25rem; }
    .mascot-msg { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 1rem; }
    .text-card { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
    .text-meta { font-size: 12px; color: #9ca3af; margin-bottom: 0.75rem; }
    .reading { font-size: 20px; line-height: 2; color: #111; }
    .word { display: inline; border-radius: 4px; padding: 1px 2px; transition: all 0.15s; }
    .word.done { color: #9ca3af; }
    .word.error { background: #fee2e2; color: #991b1b; padding: 1px 4px; }
    .prog-wrap { background: #f3f4f6; border-radius: 8px; height: 8px; margin-bottom: 4px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 8px; background: #10b981; transition: width 0.3s; }
    .prog-label { font-size: 11px; color: #9ca3af; text-align: right; margin-bottom: 1rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
    .stat { background: #f9fafb; border-radius: 10px; padding: 10px; text-align: center; }
    .stat-n { font-size: 22px; font-weight: 600; color: #111; }
    .stat-l { font-size: 10px; color: #9ca3af; margin-top: 2px; }
    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn.idle { background: #10b981; color: white; }
    .btn.recording { background: #ef4444; color: white; animation: pulse 1.2s infinite; }
    .btn.finished { background: #3b82f6; color: white; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    .result { background: #f0fdf4; border: 1px solid #86efac; border-radius: 14px; padding: 1.25rem; margin-top: 1rem; display: none; }
    .result.show { display: block; }
    .result-title { font-size: 15px; font-weight: 600; color: #166534; margin-bottom: 0.75rem; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .result-item { background: white; border-radius: 8px; padding: 10px; text-align: center; }
    .result-n { font-size: 22px; font-weight: 600; color: #166534; }
    .result-l { font-size: 10px; color: #4ade80; }
    .api-box { background: #fefce8; border: 1px solid #fde047; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .api-box input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 13px; margin-top: 6px; }
    .api-box label { font-size: 12px; color: #854d0e; font-weight: 500; }
  </style>
</head>
<body>
<div class="screen">

  <div class="api-box">
    <label>🔑 Tu API key de OpenAI</label>
    <input type="password" id="apikey" placeholder="sk-..." />
  </div>

  <div class="top">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="avatar">AL</div>
      <div>
        <div style="font-size:13px;font-weight:600;">¡Hola, Alejandro!</div>
        <div style="font-size:11px;color:#9ca3af;">Sesión 25</div>
      </div>
    </div>
    <span class="level">Nivel 2B</span>
  </div>

  <div class="mascot" id="mascot">📖</div>
  <div class="mascot-msg" id="msg">Lee el texto en voz alta cuando estés listo</div>

  <div class="text-card">
    <div class="text-meta">Las abejas — Ciencias Naturales · 40 palabras</div>
    <div class="reading" id="texto"></div>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="prog-label" id="prog-label">0 de 40 palabras</div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="ppm">—</div><div class="stat-l">palabras/min</div></div>
    <div class="stat"><div class="stat-n" id="tiempo">0s</div><div class="stat-l">tiempo</div></div>
    <div class="stat"><div class="stat-n" id="errores">0</div><div class="stat-l">errores</div></div>
  </div>

  <button class="btn idle" id="btn" onclick="toggleLectura()">🎤 Pulsa para leer</button>

  <div class="result" id="result">
    <div class="result-title">🌟 ¡Muy bien, Alejandro!</div>
    <div class="result-grid">
      <div class="result-item"><div class="result-n" id="r-ppm">—</div><div class="result-l">palabras por minuto</div></div>
      <div class="result-item"><div class="result-n" id="r-prec">—</div><div class="result-l">precisión</div></div>
    </div>
  </div>
</div>

<script>
const textOriginal = "Las abejas son insectos que viven en colonias. Dentro de la colmena trabajan juntas para producir miel. La abeja reina pone huevos y las obreras cuidan la colmena. Recogen el néctar de las flores y lo transforman en miel.";
const palabras = textOriginal.split(" ");

const texto = document.getElementById("texto");
palabras.forEach((p, i) => {
  const span = document.createElement("span");
  span.className = "word";
  span.id = "w" + i;
  span.textContent = p + " ";
  texto.appendChild(span);
});

let grabando = false;
let mediaRecorder, audioChunks = [];
let timer, segundos = 0, errores = 0;
let inicio;

function toggleLectura() {
  if (!grabando) iniciar(); else parar();
}

async function iniciar() {
  const apikey = document.getElementById("apikey").value.trim();
  if (!apikey) { alert("Introduce tu API key de OpenAI primero"); return; }

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.start();

  grabando = true;
  inicio = Date.now();
  const btn = document.getElementById("btn");
  btn.className = "btn recording";
  btn.textContent = "⏹ Leyendo... pulsa para terminar";
  document.getElementById("mascot").textContent = "🎤";
  document.getElementById("msg").textContent = "¡Te escucho! Sigue leyendo...";

  timer = setInterval(() => {
    segundos = Math.round((Date.now() - inicio) / 1000);
    document.getElementById("tiempo").textContent = segundos + "s";
  }, 1000);
}

async function parar() {
  grabando = false;
  clearInterval(timer);
  mediaRecorder.stop();

  document.getElementById("btn").className = "btn finished";
  document.getElementById("btn").textContent = "⏳ Analizando...";
  document.getElementById("btn").disabled = true;
  document.getElementById("mascot").textContent = "🔍";
  document.getElementById("msg").textContent = "Analizando tu lectura...";

  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: "audio/webm" });
    const formData = new FormData();
    formData.append("file", blob, "lectura.webm");
    formData.append("model", "whisper-1");
    formData.append("language", "es");

    const apikey = document.getElementById("apikey").value.trim();
    const res = await fetch("https://api.openai.com/v1/audio/transcriptions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + apikey },
      body: formData
    });

    const data = await res.json();
    const transcripcion = data.text || "";
    procesarResultado(transcripcion);
  };
}

function normalizar(str) {
  return str.toLowerCase().replace(/[.,;:!?¡¿]/g, "").trim();
}

function procesarResultado(transcripcion) {
  const leidas = transcripcion.split(" ").map(normalizar).filter(w => w.length > 0);
  errores = 0;
  let coincidencias = 0;

  palabras.forEach((p, i) => {
    const orig = normalizar(p);
    const span = document.getElementById("w" + i);
    if (leidas.includes(orig)) {
      span.className = "word done";
      coincidencias++;
    } else {
      span.className = "word error";
      errores++;
    }
  });

  document.getElementById("prog").style.width = "100%";
  document.getElementById("prog-label").textContent = palabras.length + " de " + palabras.length + " palabras";
  document.getElementById("errores").textContent = errores;

  const ppmFinal = Math.round((palabras.length / segundos) * 60);
  const precFinal = Math.round((coincidencias / palabras.length) * 100);
  document.getElementById("ppm").textContent = ppmFinal;
  document.getElementById("r-ppm").textContent = ppmFinal;
  document.getElementById("r-prec").textContent = precFinal + "%";

  document.getElementById("btn").textContent = "✓ Lectura completada";
  document.getElementById("mascot").textContent = "🌟";
  document.getElementById("msg").textContent = "¡Genial! Mira tus resultados";
  document.getElementById("result").classList.add("show");
}
</script>
</body>
</html>
