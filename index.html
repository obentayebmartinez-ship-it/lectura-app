{ id: "2p-09", titulo: "Los oficios", materia: "Conocimiento del Medio", texto: "Hay muchos oficios diferentes en nuestra sociedad. Los médicos cuidan nuestra salud cuando estamos enfermos. Los maestros nos enseñan en el colegio. Los bomberos apagan los incendios y nos ayudan en las emergencias. Los agricultores cultivan los alimentos que comemos cada día. Los ingenieros diseñan puentes, edificios y máquinas. Todos los oficios son importantes y necesarios para que la sociedad funcione bien. Cuando seamos mayores podremos elegir el trabajo que más nos guste." },
{ id: "2p-10", titulo: "El reciclaje", materia: "Ciencias Naturales", texto: "Reciclar significa transformar los objetos usados en materiales nuevos. En casa separamos los residuos en diferentes contenedores. El papel y el cartón van al contenedor azul. Los envases de plástico y las latas van al amarillo. El vidrio va al verde. Los restos de comida se pueden usar para hacer abono. Reciclar es muy importante porque ayuda a cuidar el medio ambiente y a no desperdiciar los recursos naturales de nuestro planeta." },
{ id: "2p-11", titulo: "Los volcanes", materia: "Ciencias Naturales", texto: "Los volcanes son montañas por las que sale material fundido desde el interior de la Tierra. Cuando un volcán entra en erupción expulsa lava, ceniza y gases a gran temperatura. La lava es roca líquida que puede destruir todo lo que encuentra a su paso. Aunque son peligrosos, los volcanes también crean nuevas tierras y hacen que el suelo sea muy fértil. Las Islas Canarias son un ejemplo de islas formadas por volcanes hace millones de años." },
{ id: "2p-12", titulo: "El dinero y los precios", materia: "Matemáticas", texto: "El dinero nos sirve para comprar cosas que necesitamos. En España usamos el euro como moneda. Un euro tiene cien céntimos. Cuando vamos a una tienda miramos el precio de los productos y calculamos si tenemos suficiente dinero. Si algo cuesta dos euros con cincuenta céntimos y damos cinco euros, nos devuelven dos euros y cincuenta céntimos de cambio. Aprender a manejar el dinero es una habilidad matemática muy útil para la vida diaria." },
{ id: "2p-13", titulo: "Los seres vivos", materia: "Ciencias Naturales", texto: "Los seres vivos son todos aquellos que nacen, crecen, se reproducen y mueren. Las plantas, los animales y las personas somos seres vivos. Los seres vivos necesitan alimentarse para obtener energía. También necesitan relacionarse con su entorno para sobrevivir. Las piedras, el agua y el aire no son seres vivos porque no nacen ni crecen. Los científicos que estudian los seres vivos se llaman biólogos y trabajan para comprender mejor la naturaleza que nos rodea." },
{ id: "2p-14", titulo: "Los medios de comunicación", materia: "Conocimiento del Medio", texto: "Los medios de comunicación nos permiten estar informados de lo que ocurre en el mundo. La televisión, la radio, los periódicos e internet son los más importantes. A través de ellos nos enteramos de las noticias, el tiempo y los deportes. Internet ha cambiado mucho la forma en que nos comunicamos porque podemos hablar con personas de cualquier parte del mundo en segundos. Es importante usar los medios de comunicación de forma responsable y contrastar la información que recibimos." },
{ id: "2p-15", titulo: "Las máquinas simples", materia: "Tecnología", texto: "Las máquinas simples nos ayudan a realizar trabajos con menos esfuerzo. La palanca nos permite mover objetos pesados apoyándola en un punto fijo. El plano inclinado facilita subir objetos pesados usando una rampa. La polea permite levantar cargas usando una cuerda y una rueda. La rueda es una de las invenciones más importantes de la historia porque permite transportar objetos fácilmente. Sin las máquinas simples no existirían las máquinas complejas que usamos hoy en día." }
],
"3P": [
{ id: "3p-01", titulo: "La célula", materia: "Ciencias Naturales", texto: "La célula es la unidad más pequeña de los seres vivos. Todos los organismos están formados por células. Algunas células son tan pequeñas que solo podemos verlas con un microscopio. Las células tienen diferentes partes: la membrana que las rodea, el citoplasma que las rellena y el núcleo que contiene la información genética. Las células se reproducen dividiéndose en dos para formar nuevas células. El cuerpo humano tiene billones de células que trabajan juntas para mantenernos vivos y sanos cada día." },
{ id: "3p-02", titulo: "La Reconquista", materia: "Historia", texto: "La Reconquista fue el proceso por el que los reinos cristianos del norte de la península ibérica fueron recuperando los territorios que habían sido conquistados por los musulmanes. Este proceso duró casi ocho siglos, desde el año 722 hasta 1492. Durante este tiempo convivieron en España tres culturas: la cristiana, la musulmana y la judía. Esta convivencia enriqueció enormemente la cultura española. En 1492 los Reyes Católicos tomaron Granada, el último reino musulmán de la península, poniendo fin a la Reconquista." },
{ id: "3p-03", titulo: "Las fracciones", materia: "Matemáticas", texto: "Las fracciones nos sirven para expresar partes de un todo. Si partimos una pizza en cuatro trozos iguales y nos comemos uno, hemos comido un cuarto de la pizza. El número de arriba se llama numerador e indica las partes que tomamos. El de abajo se llama denominador e indica en cuántas partes dividimos el total. Las fracciones equivalentes representan la misma cantidad aunque tengan números diferentes. Por ejemplo, un medio es igual a dos cuartos porque representan la misma proporción del total." },
{ id: "3p-04", titulo: "El aparato digestivo", materia: "Ciencias Naturales", texto: "El aparato digestivo transforma los alimentos en nutrientes que el cuerpo puede absorber. El proceso comienza en la boca donde los dientes trituran la comida y la saliva la humedece. Después pasa por el esófago hasta llegar al estómago donde se mezcla con los jugos gástricos. En el intestino delgado se absorben los nutrientes y pasan a la sangre. Los restos que el cuerpo no necesita llegan al intestino grueso y se expulsan. Todo este proceso tarda varias horas en completarse." },
{ id: "3p-05", titulo: "Los ecosistemas", materia: "Ciencias Naturales", texto: "Un ecosistema es el conjunto formado por los seres vivos de un lugar y el medio en que viven. En un ecosistema todos los organismos están relacionados entre sí. Las plantas producen su propio alimento mediante la fotosíntesis y sirven de alimento a los herbívoros. Los carnívoros se alimentan de otros animales. Cuando los seres vivos mueren, los descomponedores transforman su materia en nutrientes para el suelo. Los ecosistemas pueden ser terrestres como los bosques o acuáticos como los ríos y mares." },
{ id: "3p-06", titulo: "La atmósfera", materia: "Ciencias Naturales", texto: "La atmósfera es la capa de gases que rodea la Tierra. Está formada principalmente por nitrógeno y oxígeno. La atmósfera nos protege de los rayos dañinos del sol y de los meteoritos que caen desde el espacio. También regula la temperatura del planeta evitando que sea demasiado fría de noche o demasiado caliente de día. La contaminación daña la atmósfera y puede provocar el cambio climático. Por eso es importante reducir las emisiones de gases contaminantes cuidando el medio de transporte que usamos." },
{ id: "3p-07", titulo: "Los romanos en Hispania", materia: "Historia", texto: "Los romanos conquistaron la península ibérica hace más de dos mil años y la llamaron Hispania. Durante siglos construyeron calzadas, acueductos, puentes y ciudades que todavía podemos ver hoy. El acueducto de Segovia y el teatro de Mérida son ejemplos de la gran arquitectura romana. Los romanos también nos dejaron su lengua, el latín, de la que deriva el español actual. Su sistema de leyes influyó en el derecho moderno. La romanización transformó completamente la cultura y la forma de vida de los pueblos que habitaban la península ibérica." },
{ id: "3p-08", titulo: "La multiplicación", materia: "Matemáticas", texto: "La multiplicación es una operación matemática que consiste en sumar un número tantas veces como indica otro número. Por ejemplo, tres por cuatro es lo mismo que sumar tres cuatro veces. El resultado de una multiplicación se llama producto. Conocer las tablas de multiplicar nos permite hacer cálculos más rápidos. La multiplicación tiene propiedades importantes: el orden de los factores no cambia el producto y multiplicar por cero siempre da cero. Las multiplicaciones las usamos constantemente en la vida cotidiana cuando compramos o medimos." },
{ id: "3p-09", titulo: "El sistema circulatorio", materia: "Ciencias Naturales", texto: "El sistema circulatorio transporta la sangre por todo el cuerpo. El corazón es el órgano principal y funciona como una bomba que impulsa la sangre. Las arterias llevan la sangre con oxígeno desde el corazón hasta los órganos. Las venas devuelven la sangre sin oxígeno de vuelta al corazón. Los capilares son los vasos más pequeños y llegan a todas las células del cuerpo. El corazón late unas setenta veces por minuto en reposo. Hacer ejercicio regularmente fortalece el corazón y mejora la circulación sanguínea." },
{ id: "3p-10", titulo: "Los continentes", materia: "Geografía", texto: "La superficie de la Tierra está dividida en continentes y océanos. Los continentes son grandes extensiones de tierra: Europa, Asia, África, América, Oceanía y la Antártida. Asia es el continente más grande y Oceanía el más pequeño. Europa es el continente donde vivimos y está formado por muchos países con culturas diferentes. Los continentes están separados por océanos. El océano Atlántico separa Europa y África de América. Hace millones de años todos los continentes estaban unidos formando un único supercontinente llamado Pangea." },
{ id: "3p-11", titulo: "La energía", materia: "Ciencias Naturales", texto: "La energía es la capacidad de producir cambios o realizar trabajo. Existen muchos tipos de energía: la solar, la eólica, la hidráulica y la química entre otras. La energía solar proviene del sol y es renovable. La energía eólica se obtiene del viento mediante aerogeneradores. Los combustibles fósiles como el petróleo y el carbón producen energía pero contaminan el ambiente. Las energías renovables no se agotan y son más respetuosas con el medio ambiente. España es uno de los países europeos que más energía renovable produce." },
{ id: "3p-12", titulo: "La división", materia: "Matemáticas", texto: "La división nos permite repartir una cantidad en partes iguales. Si tenemos veinticuatro caramelos y queremos repartirlos entre seis amigos, cada uno recibirá cuatro. El número que dividimos se llama dividendo, el que divide se llama divisor y el resultado se llama cociente. A veces la división no es exacta y sobra alguna cantidad que llamamos resto. Comprobar una división multiplicando el cociente por el divisor y sumando el resto debe darnos el dividendo original. La división es una operación fundamental en matemáticas." },
{ id: "3p-13", titulo: "Las plantas con flores", materia: "Ciencias Naturales", texto: "Las plantas con flores son el grupo más numeroso del reino vegetal. Sus flores son los órganos reproductores que producen frutos y semillas. El proceso comienza cuando el polen de una flor llega al pistilo de otra flor gracias a los insectos o el viento. Esto se llama polinización. Tras la polinización se forman los frutos que contienen las semillas. Cuando las semillas caen al suelo y encuentran las condiciones adecuadas germinan y dan lugar a nuevas plantas. Las flores también tienen una función estética y producen perfumes utilizados en cosmética." },
{ id: "3p-14", titulo: "La prehistoria", materia: "Historia", texto: "La prehistoria es el período más largo de la historia humana. Comenzó con la aparición de los primeros seres humanos y terminó con la invención de la escritura. Durante la prehistoria los humanos vivían en cuevas y se alimentaban cazando animales y recolectando frutos. Poco a poco aprendieron a cultivar la tierra y a criar animales, lo que se conoce como la revolución neolítica. También aprendieron a fabricar herramientas de piedra y más tarde de metal. Las pinturas rupestres de Altamira nos dan información sobre cómo vivían nuestros antepasados prehistóricos." },
{ id: "3p-15", titulo: "El agua en la naturaleza", materia: "Ciencias Naturales", texto: "El agua es el elemento más abundante en la superficie de la Tierra y es fundamental para la vida. Se presenta en tres estados: líquido en ríos, mares y lluvia; sólido en hielos y nieve; y gaseoso en el vapor de agua. El ciclo del agua describe cómo el agua se evapora del mar, forma nubes, precipita en forma de lluvia o nieve y vuelve al mar por los ríos. El agua dulce que podemos beber es escasa y debemos cuidarla. Solo el tres por ciento del agua de la Tierra es dulce." }
],
"4P": [
{ id: "4p-01", titulo: "La Tierra y sus movimientos", materia: "Ciencias Naturales", texto: "La Tierra realiza dos movimientos principales. El movimiento de rotación es el giro sobre su propio eje y dura veinticuatro horas, originando el día y la noche. El movimiento de traslación es el recorrido alrededor del Sol y dura trescientos sesenta y cinco días, lo que equivale a un año. La inclinación del eje terrestre provoca las estaciones del año. Cuando el hemisferio norte está inclinado hacia el Sol es verano en Europa y cuando se aleja es invierno. Los movimientos de la Tierra son fundamentales para entender el clima y la distribución de la luz solar en nuestro planeta." },
{ id: "4p-02", titulo: "La Edad Media", materia: "Historia", texto: "La Edad Media es el período histórico que transcurrió entre la caída del Imperio Romano en el siglo V y el descubrimiento de América en 1492. Durante este tiempo Europa estaba organizada en feudos donde el señor feudal tenía el control sobre las tierras y los campesinos. La Iglesia tenía un papel muy importante en la sociedad medieval. Las ciudades crecieron alrededor de las catedrales y los castillos. Las Cruzadas fueron expediciones militares organizadas para recuperar los Santos Lugares. En este período florecieron las universidades y el arte gótico dejó construcciones impresionantes que todavía admiramos hoy en día." },
{ id: "4p-03", titulo: "Las fracciones y los decimales", materia: "Matemáticas", texto: "Los números decimales son una forma de expresar cantidades que no son enteras. El punto o la coma separa la parte entera de la parte decimal. Así, el número tres con cinco representa tres unidades y cinco décimas. Los decimales y las fracciones están relacionados: un medio equivale a cero coma cinco. Usamos los decimales constantemente en la vida cotidiana, por ejemplo cuando pagamos en una tienda o medimos una longitud. Operar con decimales requiere alinear correctamente las cifras para no cometer errores en las sumas, restas, multiplicaciones y divisiones." },
{ id: "4p-04", titulo: "El aparato respiratorio", materia: "Ciencias Naturales", texto: "El aparato respiratorio nos permite obtener el oxígeno del aire que necesitamos para vivir. El proceso comienza cuando inspiramos aire por la nariz o la boca. El aire pasa por la tráquea hasta llegar a los pulmones donde se ramifica en bronquios y bronquiolos. En los alvéolos pulmonares el oxígeno pasa a la sangre y el dióxido de carbono sale hacia el exterior al espirar. Respiramos unas quince veces por minuto en reposo. El tabaco daña gravemente los pulmones y dificulta la respiración. Practicar deporte mejora la capacidad pulmonar y la eficiencia respiratoria." },
{ id: "4p-05", titulo: "Los polígonos", materia: "Matemáticas", texto: "Los polígonos son figuras geométricas cerradas formadas por segmentos rectos llamados lados. Se clasifican según el número de lados: el triángulo tiene tres, el cuadrilátero cuatro, el pentágono cinco y el hexágono seis. Los triángulos pueden ser equiláteros si tienen los tres lados iguales, isósceles si tienen dos iguales y escalenos si los tres son diferentes. El perímetro de un polígono es la suma de todos sus lados. El área nos indica la superficie que ocupa. Conocer las propiedades de los polígonos es fundamental para la arquitectura, el diseño y muchas otras disciplinas." },
{ id: "4p-06", titulo: "Los Reyes Católicos", materia: "Historia", texto: "Los Reyes Católicos, Isabel de Castilla y Fernando de Aragón, unificaron los reinos de la península ibérica a finales del siglo XV. Durante su reinado se completó la Reconquista con la toma de Granada en 1492 y ese mismo año Cristóbal Colón descubrió América. También expulsaron a los judíos mediante el Edicto de Granada y establecieron la Inquisición. Su política matrimonial unió a España con otros reinos europeos. Los Reyes Católicos sentaron las bases del Estado moderno español y convirtieron a España en una potencia mundial que dominaría buena parte del mundo durante el siglo siguiente." },
{ id: "4p-07", titulo: "La luz y el sonido", materia: "Ciencias Naturales", texto: "La luz y el sonido son formas de energía que se transmiten en forma de ondas. La luz viaja a trescientos mil kilómetros por segundo y puede propagarse en el vacío. El sonido necesita un medio material para propagarse y viaja mucho más lento que la luz. Por eso vemos el relámpago antes de oír el trueno. La luz blanca está formada por todos los colores del arco iris que podemos ver cuando la luz pasa por un prisma. El sonido se produce por vibraciones y su intensidad se mide en decibelios. El exceso de ruido puede dañar el oído." },
{ id: "4p-08", titulo: "El sistema nervioso", materia: "Ciencias Naturales", texto: "El sistema nervioso coordina todas las funciones del cuerpo y nos permite relacionarnos con el entorno. Está formado por el cerebro, el cerebelo, el tronco encefálico, la médula espinal y los nervios. El cerebro es el órgano más importante y controla el pensamiento, la memoria y las emociones. El cerebelo coordina los movimientos y el equilibrio. Los nervios transmiten información desde los sentidos hasta el cerebro y desde el cerebro hasta los músculos. Las neuronas son las células del sistema nervioso y se comunican entre sí mediante impulsos eléctricos y químicos." },
{ id: "4p-09", titulo: "España en el mundo", materia: "Geografía", texto: "España está situada en el suroeste de Europa, en la península ibérica. Limita al norte con Francia y Andorra, al oeste con Portugal y está rodeada por el mar Mediterráneo y el océano Atlántico. Además del territorio peninsular, España incluye las islas Baleares en el Mediterráneo, las islas Canarias en el Atlántico y las ciudades autónomas de Ceuta y Melilla en África. España es miembro de la Unión Europea desde 1986. Madrid es la capital y la ciudad más poblada. El español es la segunda lengua más hablada del mundo con más de quinientos millones de hablantes." },
{ id: "4p-10", titulo: "La materia y sus estados", materia: "Ciencias Naturales", texto: "La materia es todo lo que tiene masa y ocupa un espacio. Se puede presentar en tres estados principales: sólido, líquido y gaseoso. En el estado sólido las moléculas están muy juntas y la materia tiene forma propia. En el estado líquido las moléculas se mueven con más libertad y la materia toma la forma del recipiente que la contiene. En el estado gaseoso las moléculas están muy separadas y la materia se expande llenando todo el espacio disponible. Los cambios de estado se producen al variar la temperatura: la fusión, la evaporación, la solidificación y la condensación." },
{ id: "4p-11", titulo: "El descubrimiento de América", materia: "Historia", texto: "El doce de octubre de 1492 Cristóbal Colón llegó a América creyendo haber encontrado una nueva ruta hacia Asia. Este acontecimiento cambió la historia del mundo para siempre. Los españoles conquistaron grandes imperios como el azteca en México y el inca en Perú. La colonización trajo consigo el intercambio de productos entre los dos continentes: el tomate, la patata y el chocolate llegaron a Europa desde América. Sin embargo, también supuso la destrucción de culturas indígenas y el sufrimiento de millones de personas. El encuentro entre dos mundos transformó definitivamente la historia de la humanidad." },
{ id: "4p-12", titulo: "Las magnitudes y las medidas", materia: "Matemáticas", texto: "Medir consiste en comparar una magnitud con una unidad de medida. Las magnitudes más comunes son la longitud, la masa, el tiempo y la capacidad. La unidad de longitud en el sistema métrico decimal es el metro. El kilómetro equivale a mil metros y el centímetro es la centésima parte de un metro. La unidad de masa es el kilogramo. Para medir el tiempo usamos segundos, minutos y horas. Es importante conocer las equivalencias entre unidades para poder convertir unas en otras y resolver problemas de la vida cotidiana correctamente." },
{ id: "4p-13", titulo: "Los seres vivos y su clasificación", materia: "Ciencias Naturales", texto: "Los científicos clasifican los seres vivos en cinco reinos: animales, plantas, hongos, protistas y moneras. Los animales se mueven y se alimentan de otros seres vivos. Las plantas producen su propio alimento mediante la fotosíntesis. Los hongos se alimentan de materia orgánica en descomposición. Los protistas son organismos unicelulares como las amebas. Las bacterias pertenecen al reino moneras. Dentro del reino animal los vertebrados tienen esqueleto interno y se dividen en mamíferos, aves, reptiles, anfibios y peces. Los invertebrados no tienen esqueleto y representan la mayoría de las especies animales del planeta." },
{ id: "4p-14", titulo: "La Revolución Industrial", materia: "Historia", texto: "La Revolución Industrial comenzó en Inglaterra a finales del siglo XVIII y transformó completamente la sociedad. La invención de la máquina de vapor permitió mecanizar la producción en las fábricas. Miles de personas abandonaron el campo para trabajar en las ciudades. Las condiciones de trabajo eran muy duras y los obreros trabajaban muchas horas por salarios muy bajos. Esto llevó al nacimiento del movimiento obrero que luchó por mejorar las condiciones laborales. La Revolución Industrial supuso un enorme avance tecnológico pero también trajo problemas sociales y medioambientales que todavía hoy debemos afrontar." },
{ id: "4p-15", titulo: "El medio ambiente", materia: "Ciencias Naturales", texto: "El medio ambiente es el conjunto de elementos naturales y artificiales que rodean a los seres vivos. La contaminación del aire, el agua y el suelo son los principales problemas medioambientales actuales. Las actividades humanas como la industria, el transporte y la agricultura intensiva generan residuos que dañan los ecosistemas. El cambio climático está provocando el aumento de las temperaturas y la subida del nivel del mar. Para proteger el medio ambiente podemos reciclar, ahorrar energía y agua, usar transportes sostenibles y consumir de forma responsable. Cuidar el planeta es responsabilidad de todos." }
],
"5P": [
{ id: "5p-01", titulo: "El universo", materia: "Ciencias Naturales", texto: "El universo es todo lo que existe: la materia, la energía, el espacio y el tiempo. Tiene una edad de aproximadamente trece mil ochocientos millones de años y se originó en el Big Bang, una gran explosión que dio lugar a toda la materia existente. El universo está formado por miles de millones de galaxias. Nuestra galaxia se llama la Vía Láctea y en ella se encuentra el sistema solar. Las estrellas son enormes bolas de gas que generan luz y calor mediante reacciones nucleares. El Sol es la estrella más cercana a la Tierra. Los avances en astronomía nos permiten conocer cada vez mejor el cosmos que nos rodea." },
{ id: "5p-02", titulo: "La España del siglo XVI", materia: "Historia", texto: "Durante el siglo XVI España se convirtió en la mayor potencia mundial gracias al imperio colonial americano. Carlos I de España, también conocido como Carlos V del Sacro Imperio Romano Germánico, gobernó un territorio inmenso. Su hijo Felipe II continuó esta política y trasladó la capital a Madrid. Durante este período florecieron las artes y las letras en lo que se conoce como el Siglo de Oro español. Escritores como Miguel de Cervantes y pintores como El Greco dejaron obras fundamentales de la cultura universal. Sin embargo, las guerras constantes y la expulsión de los moriscos debilitaron progresivamente la economía del imperio español." },
{ id: "5p-03", titulo: "Los porcentajes", materia: "Matemáticas", texto: "El porcentaje es una forma de expresar una proporción sobre cien. El símbolo que lo representa es el tanto por ciento. Si en una clase de veinticinco alumnos el cuarenta por ciento son chicas, hay diez chicas. Los porcentajes se usan constantemente en la vida cotidiana: los descuentos en las tiendas, los intereses bancarios y las estadísticas se expresan habitualmente en porcentajes. Para calcular el porcentaje de una cantidad multiplicamos esa cantidad por el porcentaje y dividimos entre cien. Saber interpretar y calcular porcentajes es una competencia matemática fundamental en la sociedad actual." },
{ id: "5p-04", titulo: "El aparato locomotor", materia: "Ciencias Naturales", texto: "El aparato locomotor nos permite movernos y está formado por el sistema óseo y el sistema muscular. El esqueleto humano tiene más de doscientos huesos que protegen los órganos internos y sirven de soporte. Las articulaciones unen los huesos y permiten el movimiento. Los músculos se contraen y se relajan para mover los huesos. Los tendones unen los músculos a los huesos y los ligamentos unen los huesos entre sí. Para mantener el aparato locomotor sano es importante hacer ejercicio regularmente, mantener una postura correcta y llevar una alimentación rica en calcio y vitamina D." },
{ id: "5p-05", titulo: "La literatura española", materia: "Lengua", texto: "La literatura española tiene una larga y rica tradición. El Cantar de Mío Cid, escrito en el siglo XII, es considerado el primer texto literario en castellano. Durante el Siglo de Oro brillaron escritores como Lope de Vega, Quevedo y Cervantes, cuyo Don Quijote de la Mancha es una de las novelas más importantes de la historia universal. En el siglo XX destacaron autores como Federico García Lorca, Antonio Machado y Miguel Hernández. La literatura nos permite conocer otras épocas, culturas y formas de pensar, desarrollando nuestra empatía y nuestra capacidad de comprensión del mundo." },
{ id: "5p-06", titulo: "Las fuerzas y el movimiento", materia: "Ciencias Naturales", texto: "Una fuerza es una acción que puede cambiar el estado de movimiento o la forma de un objeto. Las fuerzas pueden ser de contacto, como el rozamiento, o de acción a distancia, como la gravedad. La gravedad es la fuerza que atrae los objetos hacia el centro de la Tierra. Isaac Newton formuló las leyes del movimiento que explican cómo actúan las fuerzas. Cuando sobre un objeto actúan varias fuerzas que se anulan entre sí, el objeto permanece en reposo o en movimiento uniforme. Las máquinas aprovechan las fuerzas para facilitar el trabajo humano multiplicando la fuerza aplicada." },
{ id: "5p-07", titulo: "La Ilustración y las revoluciones", materia: "Historia", texto: "La Ilustración fue un movimiento intelectual del siglo XVIII que defendía la razón y el conocimiento como base del progreso humano. Los ilustrados criticaban el absolutismo y defendían la libertad y la igualdad entre las personas. Estas ideas inspiraron la Revolución Francesa de 1789, que acabó con la monarquía absoluta y proclamó los derechos del hombre y del ciudadano. El lema de la revolución era libertad, igualdad y fraternidad. La Revolución Americana también estuvo influida por estas ideas. Las revoluciones del siglo XVIII sentaron las bases de las democracias modernas y de los derechos fundamentales que hoy consideramos universales." },
{ id: "5p-08", titulo: "Las proporciones", materia: "Matemáticas", texto: "Una proporción expresa la igualdad entre dos razones. La regla de tres nos permite resolver problemas de proporcionalidad directa e inversa. En la proporcionalidad directa cuando una cantidad aumenta la otra también aumenta en la misma proporción. Por ejemplo, si un coche consume ocho litros cada cien kilómetros, para recorrer doscientos kilómetros necesitará dieciséis litros. En la proporcionalidad inversa cuando una cantidad aumenta la otra disminuye. Las proporciones tienen aplicaciones prácticas en la cocina, la construcción, la cartografía y muchas otras actividades cotidianas que realizamos sin darnos cuenta." },
{ id: "5p-09", titulo: "Los ecosistemas españoles", materia: "Ciencias Naturales", texto: "España posee una gran diversidad de ecosistemas gracias a su variada geografía y clima. El bosque mediterráneo cubre gran parte de la península y está formado por encinas, alcornoques y arbustos como el romero y el tomillo. La cornisa cantábrica tiene bosques atlánticos de robles y hayas con abundantes precipitaciones. Las zonas áridas del sureste albergan ecosistemas semidesérticos únicos en Europa. Los humedales como Doñana son refugios para miles de especies de aves migratorias. La diversidad de ecosistemas españoles hace de nuestro país uno de los lugares con mayor biodiversidad de Europa y del mundo." },
{ id: "5p-10", titulo: "La célula y la genética", materia: "Ciencias Naturales", texto: "El núcleo de las células contiene el ADN, una molécula que contiene toda la información genética del organismo. El ADN está organizado en cromosomas. Los seres humanos tenemos cuarenta y seis cromosomas en cada célula. Los genes son segmentos de ADN que determinan las características de los organismos como el color de los ojos o el grupo sanguíneo. La genética es la ciencia que estudia la herencia biológica. Gregor Mendel fue el primero en describir las leyes de la herencia estudiando plantas de guisantes en el siglo XIX. Los avances en genética tienen aplicaciones en medicina, agricultura y biotecnología." },
{ id: "5p-11", titulo: "El siglo XIX en España", materia: "Historia", texto: "El siglo XIX fue un período convulso para España. La invasión napoleónica provocó la Guerra de la Independencia entre 1808 y 1814, que supuso un gran sufrimiento para la población. Tras la guerra se inició un período de inestabilidad política con continuos cambios entre liberales y conservadores. España perdió la mayoría de sus colonias americanas en las primeras décadas del siglo. La pérdida de Cuba, Puerto Rico y Filipinas en 1898 provocó una profunda crisis que llevó a los intelectuales a reflexionar sobre el futuro del país. Este movimiento se conoce como la Generación del 98." },
{ id: "5p-12", titulo: "Estadística y probabilidad", materia: "Matemáticas", texto: "La estadística es la rama de las matemáticas que se ocupa de recoger, organizar e interpretar datos. Los datos se pueden representar mediante tablas de frecuencias, diagramas de barras, histogramas o diagramas de sectores. La media aritmética es el valor central de un conjunto de datos y se calcula sumando todos los valores y dividiendo entre el número de datos. La moda es el valor que aparece con más frecuencia. La probabilidad mide la posibilidad de que ocurra un evento y se expresa entre cero y uno. Estos conceptos son fundamentales para comprender las noticias, los sondeos y la información estadística que nos rodea." },
{ id: "5p-13", titulo: "La reproducción de los seres vivos", materia: "Ciencias Naturales", texto: "Los seres vivos se reproducen para perpetuar su especie. Existen dos tipos de reproducción: la sexual y la asexual. En la reproducción sexual intervienen dos individuos que aportan células reproductoras llamadas gametos. La unión de los gametos forma un cigoto que dará lugar a un nuevo ser. En la reproducción asexual un solo individuo origina nuevos seres idénticos a él. Las plantas pueden reproducirse de forma asexual mediante esquejes, bulbos o estolones. Los mamíferos, las aves, los reptiles, los anfibios y los peces se reproducen sexualmente aunque con estrategias muy diversas adaptadas a su entorno." },
{ id: "5p-14", titulo: "La Segunda Guerra Mundial", materia: "Historia", texto: "La Segunda Guerra Mundial fue el conflicto bélico más devastador de la historia. Comenzó en 1939 con la invasión de Polonia por Alemania nazi y terminó en 1945. Participaron casi todos los países del mundo divididos en dos bandos: los Aliados y el Eje. El régimen nazi llevó a cabo el Holocausto, el genocidio sistemático de seis millones de judíos y millones de personas de otros grupos. Las bombas atómicas lanzadas sobre Hiroshima y Nagasaki pusieron fin a la guerra en el Pacífico. El conflicto causó más de setenta millones de muertos y supuso la creación de la Organización de las Naciones Unidas para garantizar la paz mundial." },
{ id: "5p-15", titulo: "La tecnología y la sociedad", materia: "Tecnología", texto: "La tecnología ha transformado profundamente la sociedad en los últimos siglos. La revolución digital ha cambiado la forma en que trabajamos, nos comunicamos y accedemos a la información. Internet ha conectado a personas de todo el mundo y ha creado nuevas formas de negocio y entretenimiento. Las redes sociales permiten compartir información instantáneamente pero también presentan riesgos como la desinformación y la adicción. La inteligencia artificial está comenzando a automatizar tareas que antes realizaban las personas. Es fundamental desarrollar un pensamiento crítico ante la tecnología para aprovechar sus ventajas y minimizar sus riesgos en nuestra vida cotidiana." }
],
"6P": [
{ id: "6p-01", titulo: "El sistema solar", materia: "Ciencias Naturales", texto: "El sistema solar está formado por el Sol y todos los cuerpos celestes que orbitan a su alrededor, atraídos por su enorme fuerza gravitatoria. Los ocho planetas del sistema solar se dividen en dos grupos: los planetas interiores rocosos, Mercurio, Venus, Tierra y Marte, y los planetas exteriores gaseosos, Júpiter, Saturno, Urano y Neptuno. Además de los planetas existen lunas, asteroides, cometas y planetas enanos como Plutón. La distancia entre los planetas es tan grande que se mide en unidades astronómicas o en años luz. La exploración espacial nos ha permitido enviar sondas a casi todos los planetas y descubrir datos fascinantes sobre la formación y evolución de nuestro sistema solar." },
{ id: "6p-02", titulo: "La España del siglo XX", materia: "Historia", texto: "El siglo XX fue especialmente intenso para España. Tras la pérdida de las últimas colonias en 1898, el país vivió una profunda crisis. La dictadura de Primo de Rivera en los años veinte dio paso a la Segunda República en 1931. La Guerra Civil entre 1936 y 1939 enfrentó a republicanos y nacionales causando cientos de miles de muertos. La victoria del general Franco instauró una dictadura que duró hasta su muerte en 1975. La Transición democrática fue un período de consenso político que culminó con la aprobación de la Constitución de 1978. España ingresó en la Comunidad Europea en 1986 y experimentó un enorme desarrollo económico y social en las décadas siguientes." },
{ id: "6p-03", titulo: "El álgebra", materia: "Matemáticas", texto: "El álgebra es la rama de las matemáticas que utiliza letras y símbolos para representar números y cantidades desconocidas. Las expresiones algebraicas combinan números y variables mediante operaciones matemáticas. Una ecuación es una igualdad en la que hay una o más incógnitas que debemos encontrar. Para resolver una ecuación de primer grado debemos despejar la incógnita aplicando las propiedades de la igualdad. Si sumamos o restamos la misma cantidad a los dos miembros la igualdad se mantiene. El álgebra tiene aplicaciones fundamentales en física, economía, informática y en prácticamente todas las ramas del conocimiento científico y tecnológico moderno." },
{ id: "6p-04", titulo: "La nutrición y la salud", materia: "Ciencias Naturales", texto: "La nutrición es el proceso por el que el organismo obtiene y utiliza los nutrientes de los alimentos. Los hidratos de carbono nos proporcionan energía rápida. Las proteínas son necesarias para construir y reparar los tejidos. Las grasas almacenan energía y protegen los órganos. Las vitaminas y los minerales regulan las funciones corporales y refuerzan el sistema inmunitario. Una dieta equilibrada debe incluir alimentos de todos los grupos en las proporciones adecuadas. La dieta mediterránea, basada en verduras, frutas, aceite de oliva, legumbres y pescado, está reconocida como una de las más saludables del mundo y forma parte del patrimonio cultural inmaterial de la humanidad." },
{ id: "6p-05", titulo: "El Renacimiento", materia: "Historia", texto: "El Renacimiento fue un movimiento cultural que surgió en Italia en el siglo XV y se extendió por toda Europa. Supuso una recuperación del pensamiento clásico griego y romano y un interés renovado por el ser humano y la naturaleza. Los artistas del Renacimiento buscaban la belleza y la perfección técnica. Leonardo da Vinci fue el prototipo del hombre renacentista, destacando en pintura, escultura, arquitectura, ciencia e ingeniería. Miguel Ángel creó obras como el David y la bóveda de la Capilla Sixtina. La invención de la imprenta por Gutenberg facilitó la difusión del conocimiento y fue fundamental para el desarrollo del Renacimiento y la posterior Reforma protestante." },
{ id: "6p-06", titulo: "La electricidad", materia: "Ciencias Naturales", texto: "La electricidad es una forma de energía producida por el movimiento de los electrones. La corriente eléctrica es el flujo de electrones a través de un conductor. Los materiales que permiten el paso de la corriente se llaman conductores y los que no lo permiten se llaman aislantes. Un circuito eléctrico básico está formado por una fuente de energía, cables conductores y un receptor como una bombilla. La energía eléctrica se puede producir en centrales térmicas, hidroeléctricas, nucleares o mediante energías renovables como la solar fotovoltaica y la eólica. El uso responsable de la electricidad es fundamental para reducir el consumo energético y cuidar el medio ambiente." },
{ id: "6p-07", titulo: "La globalización", materia: "Ciencias Sociales", texto: "La globalización es el proceso de integración económica, social y cultural que ha conectado a todos los países del mundo. El comercio internacional, los avances en transporte y las telecomunicaciones han hecho posible que productos, personas e ideas circulen por todo el planeta con gran rapidez. La globalización ha permitido el desarrollo económico de muchos países pero también ha generado desigualdades entre naciones ricas y pobres. Las multinacionales tienen una presencia global que a veces supera el poder de los gobiernos nacionales. Los retos globales como el cambio climático, las pandemias y el terrorismo requieren respuestas coordinadas de toda la comunidad internacional para ser afrontados con eficacia." },
{ id: "6p-08", titulo: "La geometría del espacio", materia: "Matemáticas", texto: "Los cuerpos geométricos son figuras tridimensionales que tienen longitud, anchura y altura. Los poliedros son cuerpos geométricos con caras planas. El cubo tiene seis caras cuadradas, doce aristas y ocho vértices. La pirámide tiene una base poligonal y caras triangulares que se unen en un punto llamado ápice. Los cuerpos de revolución como el cilindro, el cono y la esfera tienen superficies curvas. El volumen mide el espacio que ocupa un cuerpo y se expresa en unidades cúbicas. El área lateral de un cuerpo es la suma de las áreas de todas sus caras excepto las bases. Estos conceptos son fundamentales en arquitectura e ingeniería." },
{ id: "6p-09", titulo: "Los derechos humanos", materia: "Ciencias Sociales", texto: "Los derechos humanos son los derechos fundamentales que corresponden a todas las personas por el hecho de serlo, independientemente de su nacionalidad, sexo, origen o religión. La Declaración Universal de los Derechos Humanos fue adoptada por la ONU en 1948, tras los horrores de la Segunda Guerra Mundial. Entre los derechos fundamentales están el derecho a la vida, a la libertad, a la educación, a la salud y a un juicio justo. Desafortunadamente, en muchos países estos derechos son vulnerados. Organizaciones como Amnistía Internacional trabajan para denunciar estas violaciones y proteger a las víctimas. La educación en derechos humanos es fundamental para construir una sociedad más justa." },
{ id: "6p-10", titulo: "La materia y los cambios químicos", materia: "Ciencias Naturales", texto: "La química estudia la composición, estructura y transformación de la materia. Los átomos son las partículas más pequeñas de un elemento químico. Los elementos se organizan en la tabla periódica según sus propiedades. Cuando dos o más elementos se combinan forman compuestos con propiedades diferentes. Las reacciones químicas transforman unas sustancias en otras. La combustión, la oxidación y la fotosíntesis son ejemplos de reacciones químicas cotidianas. Los cambios físicos como la fusión o la evaporación no alteran la composición química de la materia. La química tiene aplicaciones en medicina, industria, agricultura y en prácticamente todos los aspectos de nuestra vida diaria." },
{ id: "6p-11", titulo: "La Unión Europea", materia: "Ciencias Sociales", texto: "La Unión Europea es una organización política y económica formada por veintisiete países europeos. Sus orígenes se remontan a los tratados firmados en los años cincuenta para crear una comunidad económica entre los países europeos devastados por la Segunda Guerra Mundial. Con el tiempo la integración fue avanzando hasta crear un mercado único con libre circulación de personas, mercancías, servicios y capitales. El euro es la moneda común de diecinueve de los países miembros. Las instituciones europeas como el Parlamento, la Comisión y el Consejo toman decisiones que afectan a todos los ciudadanos. España ingresó en 1986 y ha recibido importantes fondos europeos para su desarrollo." },
{ id: "6p-12", titulo: "Los números enteros y racionales", materia: "Matemáticas", texto: "Los números enteros incluyen los números naturales, el cero y los números negativos. Los números negativos se usan para expresar temperaturas bajo cero, deudas o posiciones por debajo de un punto de referencia. En la recta numérica los números negativos se sitúan a la izquierda del cero. Los números racionales incluyen a los enteros y a todas las fracciones. Un número racional puede expresarse como el cociente de dos números enteros siempre que el denominador sea distinto de cero. Los números irracionales como el número pi o la raíz cuadrada de dos no pueden expresarse como fracciones exactas y tienen infinitas cifras decimales no periódicas." },
{ id: "6p-13", titulo: "La biodiversidad", materia: "Ciencias Naturales", texto: "La biodiversidad es la variedad de seres vivos que habitan la Tierra. Se estima que existen entre ocho y diez millones de especies aunque solo se han descrito aproximadamente dos millones. Los ecosistemas más ricos en biodiversidad son los bosques tropicales y los arrecifes de coral. La biodiversidad es fundamental para el equilibrio de los ecosistemas y para el bienestar humano ya que nos proporciona alimentos, medicamentos y servicios ambientales como la purificación del agua y del aire. La actividad humana está provocando una extinción masiva de especies a un ritmo sin precedentes en la historia del planeta. Proteger la biodiversidad es uno de los grandes desafíos de nuestro tiempo." },
{ id: "6p-14", titulo: "La Primera Guerra Mundial", materia: "Historia", texto: "La Primera Guerra Mundial se desarrolló entre 1914 y 1918 y enfrentó a dos bloques de países europeos. El asesinato del archiduque Francisco Fernando de Austria fue el detonante del conflicto aunque las causas profundas eran el nacionalismo, el imperialismo y la carrera armamentística. La guerra introdujo nuevas armas terribles como los gases venenosos, los tanques y los aviones. Las trincheras fueron el escenario de una guerra de posiciones que causó millones de bajas. El tratado de Versalles que puso fin al conflicto impuso condiciones tan duras a Alemania que sembraron las semillas del resentimiento que desembocaría en la Segunda Guerra Mundial veinte años después." },
{ id: "6p-15", titulo: "El cambio climático", materia: "Ciencias Naturales", texto: "El cambio climático es la alteración del clima de la Tierra provocada principalmente por las emisiones de gases de efecto invernadero resultado de la actividad humana. El dióxido de carbono liberado al quemar combustibles fósiles se acumula en la atmósfera y retiene el calor solar provocando un aumento de las temperaturas globales. Las consecuencias incluyen el deshielo de los polos, la subida del nivel del mar, el aumento de fenómenos meteorológicos extremos y la pérdida de biodiversidad. El Acuerdo de París de 2015 comprometió a casi todos los países del mundo a reducir sus emisiones para limitar el calentamiento global. La transición hacia energías renovables y un consumo más sostenible son imprescindibles para afrontar este desafío." }
]
};

// ─── Inicializar alumno y lectura ────────────────────────────────────────────
// La sesión debe quedar ligada a un alumno real de la BD: se entra desde el
// panel, que guarda el id del alumno en localStorage.
const alumnoId       = localStorage.getItem("alumno_id")     || "";
const alumnoGuardado = localStorage.getItem("alumno_nombre") || "";
const cursoAlumno    = localStorage.getItem("alumno_curso")  || "2P";
// Consentimiento de grabación (lo fija el panel desde la ficha del alumno).
// Sin él se lee y analiza igual (el audio viaja a Whisper solo para
// transcribirse), pero la grabación NO se guarda en Storage.
const consentimientoAudio = localStorage.getItem("alumno_consent_audio") === "1";

if (!alumnoId || !alumnoGuardado) {
  window.location.href = "panel.html";
} else {
  document.getElementById("alumno").value = alumnoGuardado;
  document.getElementById("alumno").readOnly = true;
  const ini = alumnoGuardado.split(" ").map(n => n[0]).filter(Boolean).join("").substring(0,2).toUpperCase();
  document.getElementById("avatar").textContent = ini || "?";
}

const lecturasDelCurso  = lecturas[cursoAlumno] || lecturas["2P"];
const sesionesAlumno    = JSON.parse(localStorage.getItem("sesiones_" + alumnoGuardado) || "[]");
const lecturasHechas    = new Set(sesionesAlumno.map(s => s.texto_id));
const lecturaPendiente  = lecturasDelCurso.find(l => !lecturasHechas.has(l.id));
const lecturaActual     = lecturaPendiente || lecturasDelCurso[0];
const numLectura        = lecturasDelCurso.findIndex(l => l.id === lecturaActual.id) + 1;

document.getElementById("nivel-badge").textContent   = "Lectura " + numLectura + "/" + lecturasDelCurso.length;
document.getElementById("materia-linea").textContent = lecturaActual.materia + " · " + lecturaActual.titulo;

const textOriginal = lecturaActual.texto;
const palabras     = textOriginal.split(" ");

const textoEl = document.getElementById("texto");
palabras.forEach((p, i) => {
  const span = document.createElement("span");
  span.className   = "word";
  span.id          = "w" + i;
  span.textContent = p + " ";
  textoEl.appendChild(span);
});

// ─── Estado de sesión ────────────────────────────────────────────────────────
let grabando      = false;
let timer         = null;
let segundos      = 0;
let inicio        = null;
let allWords      = [];         // todos los resultados de palabras acumulados
let fluencyTotal  = 0;
let fluencyCount  = 0;
let prosodyTotal  = 0;
let prosodyCount  = 0;

// Grabación completa del audio (evidencia para el docente, reanálisis futuro
// y dataset de entrenamiento del modelo propio)
let mediaRecorder = null;
let audioChunks   = [];
let micStream     = null;
let audioListo    = null;       // Promise que resuelve al Blob grabado (o null)
let ultimaSesionId = null;      // id de la sesión guardada (para "Verificar")
let guardado       = null;      // estado por fases del guardado (permite reintentar sin duplicar)

// ─── Toggle ──────────────────────────────────────────────────────────────────
function toggleLectura() {
  if (!grabando) iniciar(); else parar();
}

// ─── INICIAR ─────────────────────────────────────────────────────────────────
async function iniciar() {
  const alumno = document.getElementById("alumno").value.trim();
  if (!alumno) { alert("Introduce el nombre del alumno primero"); return; }

  // Reset
  allWords     = [];
  fluencyTotal = 0; fluencyCount = 0;
  prosodyTotal = 0; prosodyCount = 0;
  segundos     = 0;
  palabras.forEach((_, i) => {
    const s = document.getElementById("w" + i);
    if (s) s.className = "word";
  });
  document.getElementById("prog-wrap").classList.add("listening");
  document.getElementById("overlay").classList.remove("show");

  grabando = true;
  inicio   = Date.now();

  const btn = document.getElementById("btn");
  btn.className   = "btn recording";
  btn.textContent = "⏹ Leyendo... pulsa para terminar";
  document.getElementById("msg").textContent = "¡Te escucho! Sigue leyendo con calma…";

  timer = setInterval(() => {
    segundos = Math.round((Date.now() - inicio) / 1000);
    if (segundos >= 300) parar();
  }, 1000);

  try {
    // Grabar la lectura completa. El reconocimiento ya NO es en vivo: al pulsar
    // "terminar" enviamos el audio al servidor Whisper, que devuelve las
    // palabras con timestamps (ver parar() → transcribirConWhisper).
    audioChunks = []; audioListo = null;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(micStream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start(1000);
    console.log("🎙️ Grabando lectura…");

  } catch (err) {
    grabando = false;
    clearInterval(timer);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    document.getElementById("prog-wrap").classList.remove("listening");
    document.getElementById("msg").textContent = "Lee el texto en voz alta cuando estés listo";
    alert("No se pudo acceder al micrófono:\n" + err.message);
    resetBtn();
  }
}

// ─── PARAR ───────────────────────────────────────────────────────────────────
// Reconocimiento por LOTES: al terminar, cerramos la grabación y enviamos el
// audio completo al servidor Whisper. Devuelve allWords (misma forma que Azure)
// y a partir de ahí el análisis es idéntico (motor.js sin cambios).
async function parar() {
  if (!grabando) return;
  grabando = false;
  clearInterval(timer);

  // Cerrar la grabación de audio; el mismo blob se transcribe y luego se sube.
  audioListo = new Promise(resolve => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") { resolve(null); return; }
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      resolve(blob.size > 0 ? blob : null);
    };
    mediaRecorder.stop();
  });

  const btn = document.getElementById("btn");
  btn.className   = "btn finished";
  btn.textContent = "⏳ Finalizando...";
  btn.disabled    = true;
  document.getElementById("msg").textContent = "Analizando la lectura…";

  // Enviar el audio al servidor Whisper y recoger las palabras reconocidas.
  // Si falla (servidor apagado, sin conexión), se ofrece REINTENTAR con el
  // mismo audio: la grabación sigue en memoria y no hay que repetir la lectura.
  const blob = await audioListo;
  while (true) {
    try {
      allWords = await transcribirConWhisper(blob);
      break;
    } catch (err) {
      console.error("Error al transcribir con Whisper:", err);
      const reintentar = confirm("No se pudo analizar la lectura.\n" + err.message +
            "\n\n¿Está encendido el servidor de reconocimiento?\n\n" +
            "Aceptar = reintentar el análisis con el mismo audio\n" +
            "Cancelar = continuar sin análisis");
      if (!reintentar) { allWords = []; break; }
    }
  }
  mostrarResultados();
}

// ─── RESULTADOS FINALES (el análisis vive en motor.js) ──────────────────────
function mostrarResultados() {
  document.getElementById("prog-wrap").classList.remove("listening");

  // Todo el análisis (colapso de repeticiones, alineamiento NW, clasificación
  // y métricas) está en motor.js, compartido con calibrar.js. La entrada se
  // conserva tal cual para subirla cruda a Storage: es lo que permite
  // reanalizar la sesión offline y calibrar los umbrales con datos reales.
  const entradaMotor = { palabras, allWords, segundos,
                         fluencyTotal, fluencyCount, prosodyTotal, prosodyCount };
  const res = MotorLectura.analizar(entradaMotor);
  const m   = res.metricas;

  // Reset de las marcas del texto: al alumno NO se le pintan los fallos.
  palabras.forEach((_, i) => { const s = document.getElementById("w"+i); if (s) s.className = "word"; });
  document.getElementById("msg").textContent = "Lee el texto en voz alta cuando estés listo";
  resetBtn();

  // Diagnóstico descargable (crudo del reconocedor + alineamiento) para el docente.
  window.__lectoria_diag = {
    version: MotorLectura.VERSION,
    fecha: new Date().toISOString(),
    texto_id: lecturaActual.id,
    segundos_pared: segundos,
    segundos_habla: m.segLectura,
    spokenRaw: res.diag.spokenRaw,
    alineamiento: res.diag.alineamiento,
    metricas: m
  };

  // Comprensión: si el texto tiene banco de preguntas, el alumno las responde
  // ANTES de cerrar; el resultado (aciertos/total) se guarda con la sesión y en
  // verificar.html deriva el nivel de comprensión. Si no hay banco, se cierra
  // directamente y la comprensión queda como campo manual del docente.
  // Guardar la parte crítica (sesión + detalle + audio) YA, antes del test de
  // comprensión: si la página se cierra durante el quiz, la lectura no se
  // pierde. La comprensión se añade después con un update (guardarComplemento).
  guardado = { sesionId: crypto.randomUUID(), m, detallePalabras: res.detallePalabras,
               entradaMotor, audioPath: null, audioEnlazado: false,
               sesionOk: false, palabrasOk: false, rawOk: false, compOk: false,
               promesa: null };
  guardado.promesa = guardarCritico();

  const preguntas = (typeof PREGUNTAS !== "undefined" && PREGUNTAS[lecturaActual.id]) || [];
  if (preguntas.length > 0) {
    iniciarQuiz(preguntas, () => finalizarSesion(m));
  } else {
    comprensionAciertos = null; comprensionTotal = null; comprensionDetalle = null;
    finalizarSesion(m);
  }
}

// ─── Cierre de sesión: mensaje de ánimo + guardado ───────────────────────────
function finalizarSesion(m) {
  // Mensaje de ánimo (sin números ni marcas de error). El detalle —PPM,
  // errores, niveles— lo revisa el docente en verificar.html y en el panel.
  const totalErr     = m.omisiones + m.sustituciones + m.inversiones;
  const totalFluidez = m.repeticiones + m.vacilaciones;
  const totalTodo    = totalErr + totalFluidez;
  const [emoji, titulo] =
    m.leidas === 0                     ? ["🙂", "¡Gracias por leer!"] :
    totalTodo === 0                    ? ["🌟", "¡Lectura perfecta!"] :
    (totalErr === 0 && totalTodo <= 3) ? ["⭐", "¡Muy bien!"] :
    (totalErr <= 2 && totalTodo <= 5)  ? ["⭐", "¡Muy bien!"] :
    totalErr <= 5                      ? ["👏", "¡Buen trabajo!"] :
                                         ["💪", "¡Sigue practicando!"];

  document.getElementById("result-emoji").textContent = emoji;
  document.getElementById("result-title").textContent = titulo;
  document.getElementById("overlay-sub").textContent  = "Guardando la lectura…";
  document.getElementById("verificar-btn").disabled   = true;
  document.getElementById("overlay").classList.add("show");

  if (comprensionDetalle) window.__lectoria_diag.comprension = {
    aciertos: comprensionAciertos, total: comprensionTotal, respuestas: comprensionDetalle
  };

  finalizarGuardado();
}

// ─── Preguntas de comprensión ────────────────────────────────────────────────
// Sin marcar acierto/fallo en pantalla: es una evaluación, no un juego. Las
// opciones se barajan para que la correcta no caiga siempre en el mismo sitio.
let comprensionAciertos = null;   // nº de respuestas correctas (null = texto sin banco)
let comprensionTotal    = null;   // nº de preguntas presentadas
let comprensionDetalle  = null;   // [{p, elegida, correcta, acierto}] para el .raw.json
let _quizPreguntas = [], _quizIdx = 0, _quizOrden = [], _quizDone = null;

function iniciarQuiz(preguntas, onDone) {
  comprensionAciertos = 0;
  comprensionTotal    = preguntas.length;
  comprensionDetalle  = [];
  _quizPreguntas = preguntas;
  _quizIdx = 0;
  _quizDone = onDone;
  document.getElementById("quiz").classList.add("show");
  pintarPregunta();
}

function pintarPregunta() {
  const q = _quizPreguntas[_quizIdx];
  document.getElementById("quiz-prog-txt").textContent = "Pregunta " + (_quizIdx + 1) + " de " + _quizPreguntas.length;
  document.getElementById("quiz-prog-fill").style.width = (_quizIdx / _quizPreguntas.length * 100) + "%";
  document.getElementById("quiz-preg").textContent = q.p;

  // Barajar el orden de las opciones (Fisher-Yates sobre los índices)
  const idxs = q.op.map((_, i) => i);
  for (let i = idxs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  _quizOrden = idxs;

  const cont = document.getElementById("quiz-ops");
  cont.innerHTML = "";
  idxs.forEach(oi => {
    const b = document.createElement("button");
    b.className = "quiz-op";
    b.textContent = q.op[oi];
    b.onclick = () => responder(oi, b);
    cont.appendChild(b);
  });
}

function responder(opElegida, boton) {
  // Evitar doble toque mientras pasa a la siguiente
  document.querySelectorAll(".quiz-op").forEach(b => b.onclick = null);
  if (boton) boton.classList.add("elegida");

  const q = _quizPreguntas[_quizIdx];
  const acierto = opElegida === q.r;
  if (acierto) comprensionAciertos++;
  comprensionDetalle.push({ p: q.p, elegida: q.op[opElegida], correcta: q.op[q.r], acierto });

  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}

  _quizIdx++;
  setTimeout(() => {
    if (_quizIdx < _quizPreguntas.length) {
      pintarPregunta();
    } else {
      document.getElementById("quiz-prog-fill").style.width = "100%";
      document.getElementById("quiz").classList.remove("show");
      if (_quizDone) _quizDone();
    }
  }, 180);
}

// Leer en voz alta la pregunta y sus opciones (síntesis del navegador, gratis y
// local): para que la comprensión no dependa de saber decodificar bien.
function oirPregunta() {
  if (!("speechSynthesis" in window)) return;
  const q = _quizPreguntas[_quizIdx];
  window.speechSynthesis.cancel();
  const partes = [q.p].concat(_quizOrden.map((oi, n) => "Opción " + (n + 1) + ": " + q.op[oi]));
  const u = new SpeechSynthesisUtterance(partes.join(". "));
  u.lang = "es-ES"; u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

// ─── Guardar sesión (audio + métricas + detalle palabra a palabra) ───────────
// En DOS FASES, con estado por paso para poder REINTENTAR sin duplicar nada:
//   guardarCritico()     → audio + fila de sesiones + sesion_palabras.
//                          Corre en cuanto acaba el análisis, ANTES del quiz:
//                          si la página se cierra durante el test, la lectura
//                          ya está a salvo.
//   guardarComplemento() → .raw.json del motor (incluye el detalle del test)
//                          + update de los aciertos de comprensión. Corre al
//                          cerrar el quiz (finalizarGuardado).
// OJO: supabase-js no lanza excepciones, devuelve {error} — se comprueba a mano.

// Un "duplicado" al reintentar significa que ese paso YA se completó: es éxito.
const esDuplicado = e => e && (e.code === "23505" || /already exists|duplicate/i.test(e.message || ""));

async function guardarCritico() {
  try {
    if (!usuarioActual) {
      const { data } = await sb.auth.getSession();
      usuarioActual = data.session?.user || null;
      if (!usuarioActual) { console.error("Sin sesión de usuario: no se puede guardar"); return false; }
    }
    const g = guardado;

    // 1. Subir el audio grabado (evidencia para verificar + dataset), SOLO si
    // hay consentimiento de la familia. Si falla la subida, NO bloquea el
    // guardado de la sesión: mejor sin audio que perdida.
    if (!g.audioPath && consentimientoAudio) {
      const blob = audioListo ? await audioListo : null;
      if (blob) {
        const path = usuarioActual.id + "/" + g.sesionId + ".webm";
        const { error: eAudio } = await sb.storage.from("audios")
          .upload(path, blob, { contentType: blob.type || "audio/webm" });
        if (!eAudio || esDuplicado(eAudio)) g.audioPath = path;
        else console.error("Error subiendo audio (la sesión se guarda sin él):", eAudio);
      }
    }

    // 2. Guardar la sesión ligada al alumno real. La comprensión va a null:
    // el quiz aún no se ha hecho (se añade luego en guardarComplemento).
    if (!g.sesionOk) {
      const { error } = await sb.from("sesiones").insert({
        id:                g.sesionId,
        user_id:           usuarioActual.id,
        alumno_id:         alumnoId,
        alumno_nombre:     alumnoGuardado,
        texto_id:          lecturaActual.id,
        texto_titulo:      lecturaActual.titulo,
        curso:             cursoAlumno,
        ppm:               g.m.ppm,
        precision:         g.m.precision,
        fluency:           g.m.fluency,
        prosody:           g.m.prosody,
        omisiones:         g.m.omisiones,
        sustituciones:     g.m.sustituciones,
        adiciones:         g.m.adiciones,
        inversiones:       g.m.inversiones,
        repeticiones:      g.m.repeticiones,
        rectificaciones:   g.m.rectificaciones,
        vacilaciones:      g.m.vacilaciones,
        pausas_largas:     g.m.pausasLargas,
        duracion_segundos: segundos,
        audio_path:        g.audioPath,
        comprension_aciertos: null,
        comprension_total:    null,
        fecha:             new Date().toISOString()
      });
      if (error && !esDuplicado(error)) { console.error("Supabase error:", error); return false; }
      g.sesionOk = true;
      g.audioEnlazado = !!g.audioPath;
    }

    // Si el audio se subió en un reintento POSTERIOR a crear la fila, engancharlo
    if (g.sesionOk && g.audioPath && !g.audioEnlazado) {
      const { error: eUp } = await sb.from("sesiones").update({ audio_path: g.audioPath }).eq("id", g.sesionId);
      if (!eUp) g.audioEnlazado = true;
    }

    // 3. Guardar el detalle palabra a palabra (lo que revisará el docente)
    if (!g.palabrasOk) {
      if (g.detallePalabras && g.detallePalabras.length > 0) {
        const filas = g.detallePalabras.map(p => ({ ...p, sesion_id: g.sesionId, user_id: usuarioActual.id }));
        const { error: eDet } = await sb.from("sesion_palabras").insert(filas);
        if (eDet) { console.error("Error guardando el detalle de palabras:", eDet); return false; }
      }
      g.palabrasOk = true;
    }
    return true;
  } catch (e) {
    console.error("Error guardando sesión:", e);
    return false;
  }
}

async function guardarComplemento() {
  const g = guardado;
  try {
    // 1b. Subir la entrada cruda del motor (con el detalle del test): junto con
    // las correcciones del docente es lo que permite reanalizar la sesión
    // offline y calibrar los umbrales con calibrar.js. Mismo bucket que el audio.
    if (!g.rawOk && g.entradaMotor) {
      const raw = new Blob([JSON.stringify({
        version:      MotorLectura.VERSION,
        fecha:        new Date().toISOString(),
        texto_id:     lecturaActual.id,
        texto_titulo: lecturaActual.titulo,
        curso:        cursoAlumno,
        entrada:      g.entradaMotor,
        comprension:  comprensionDetalle ? { aciertos: comprensionAciertos, total: comprensionTotal, respuestas: comprensionDetalle } : null
      })], { type: "application/json" });
      const { error: eRaw } = await sb.storage.from("audios")
        .upload(usuarioActual.id + "/" + g.sesionId + ".raw.json", raw, { contentType: "application/json" });
      if (eRaw && !esDuplicado(eRaw)) { console.error("Error subiendo el crudo del motor:", eRaw); return false; }
    }
    g.rawOk = true;

    // 2b. Anotar el resultado del test de comprensión en la sesión
    if (!g.compOk && comprensionTotal != null) {
      const { error: eComp } = await sb.from("sesiones")
        .update({ comprension_aciertos: comprensionAciertos, comprension_total: comprensionTotal })
        .eq("id", g.sesionId);
      if (eComp) { console.error("Error guardando la comprensión:", eComp); return false; }
    }
    g.compOk = true;
    return true;
  } catch (e) {
    console.error("Error completando el guardado:", e);
    return false;
  }
}

// Espera el guardado crítico (que arrancó antes del quiz), añade el complemento
// y refleja el resultado en el overlay. Si algo falló, ofrece reintentar.
async function finalizarGuardado() {
  document.getElementById("overlay-sub").textContent  = "Guardando la lectura…";
  document.getElementById("reintentar-btn").style.display = "none";

  const ok = (await guardado.promesa) && (await guardarComplemento());
  if (!ok) { errorGuardado(); return; }

  // Marcar la lectura como hecha SOLO si se guardó bien y se leyó algo:
  // una sesión fallida (sin palabras) no debe hacer avanzar al alumno.
  if (guardado.m.leidas > 0) {
    const ses = JSON.parse(localStorage.getItem("sesiones_" + alumnoGuardado) || "[]");
    if (!ses.some(s => s.texto_id === lecturaActual.id)) {
      ses.push({ texto_id: lecturaActual.id });
      localStorage.setItem("sesiones_" + alumnoGuardado, JSON.stringify(ses));
    }
  }

  // Sesión guardada: habilitamos el paso a la verificación docente
  ultimaSesionId = guardado.sesionId;
  document.getElementById("overlay-sub").textContent = "Lectura guardada correctamente.";
  document.getElementById("verificar-btn").disabled  = false;
}

function reintentarGuardado() {
  guardado.promesa = guardarCritico();   // retoma solo los pasos que faltan
  finalizarGuardado();
}

function errorGuardado() {
  const sub = document.getElementById("overlay-sub");
  if (sub) sub.textContent = "No se pudo guardar la lectura. Comprueba la conexión y pulsa «Reintentar guardado»: los datos siguen aquí.";
  document.getElementById("reintentar-btn").style.display = "block";
}

// El alumno no ve datos; estos botones son para el docente al terminar
function irVerificar() {
  if (ultimaSesionId) window.location.href = "verificar.html?sesion=" + ultimaSesionId;
}

function descargarDiag() {
  if (!window.__lectoria_diag) return;
  const blob = new Blob([JSON.stringify(window.__lectoria_diag, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "diagnostico_" + (lecturaActual.id || "sesion") + "_" + Date.now() + ".json";
  a.click();
}

function resetBtn() {
  const btn = document.getElementById("btn");
  btn.className   = "btn idle";
  btn.textContent = "🎤 Nueva lectura";
  btn.disabled    = false;
}
</script>
</body>
