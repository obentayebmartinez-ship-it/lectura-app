<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: system-ui, sans-serif; background: #f5f5f0; color: #111; }
/* Ocupa toda la pantalla: cabecera arriba, lectura que crece en el centro y
   botón de grabar siempre visible abajo (sin necesidad de hacer scroll). */
.screen { max-width: 900px; margin: 0 auto; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; padding: 0.9rem 1.1rem 0; gap: 0.7rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.brand { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; }
.back-btn { font-size: 12px; color: #6b7280; border: 0.5px solid #d1d5db; border-radius: 8px; padding: 5px 12px; background: #fff; cursor: pointer; }
.alumno-row { display: flex; align-items: center; gap: 12px; background: #fff; border: 0.5px solid #e5e7eb; border-radius: 12px; padding: 0.65rem 0.9rem; flex-shrink: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #E1F5EE; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 13px; color: #0F6E56; flex-shrink: 0; }
.alumno-info { flex: 1; min-width: 0; }
.alumno-input { width: 100%; padding: 0; border: none; background: transparent; font-size: 14px; font-weight: 500; color: #111; outline: none; }
.alumno-input::placeholder { color: #9ca3af; font-weight: 400; }
.alumno-sub { font-size: 11px; color: #6b7280; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nivel-badge { font-size: 11px; background: #E1F5EE; color: #0F6E56; padding: 3px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
/* Tarjeta de lectura: crece para llenar el hueco y hace scroll interno si el
   texto es muy largo. La tipografía escala con el tamaño de pantalla. */
.texto-card { flex: 1; min-height: 0; overflow-y: auto; background: #fff; border: 0.5px solid #e5e7eb; border-radius: 16px; padding: clamp(1rem, 3.5vw, 2.25rem); }
.reading { font-size: clamp(20px, 2.4vw, 30px); line-height: 1.95; color: #111; max-width: 46ch; margin: 0 auto; }
.word { display: inline; }
/* Barra inferior fija con el botón de grabar */
.barra-inferior { flex-shrink: 0; background: #f5f5f0; padding: 0.5rem 0 0.9rem; }
.hint { text-align: center; font-size: 12.5px; color: #6b7280; margin-bottom: 0.5rem; min-height: 16px; }
.prog-wrap { background: #e5e7eb; border-radius: 6px; height: 5px; margin-bottom: 0.6rem; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 6px; background: #1D9E75; transition: width 0.3s; width: 0; }
.prog-wrap.listening .prog-fill { width: 100% !important; animation: progPulse 1.4s ease-in-out infinite; }
@keyframes progPulse { 0%,100%{opacity:.25} 50%{opacity:.7} }
.btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s; }
.btn.idle { background: #1D9E75; color: #fff; }
.btn.recording { background: #E24B4A; color: #fff; animation: pulse 1.2s infinite; }
.btn.finished { background: #378ADD; color: #fff; }
.btn.azul { background: #378ADD; color: #fff; }
.btn.gris { background: #fff; color: #374151; border: 0.5px solid #d1d5db; }
.btn:disabled { opacity: .6; cursor: default; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
/* Overlay de fin de sesión: mensaje amable, SIN datos numéricos para el alumno */
.overlay { position: fixed; inset: 0; background: rgba(30,30,30,0.45); display: none; align-items: center; justify-content: center; padding: 1.25rem; z-index: 100; }
.overlay.show { display: flex; animation: ovIn .18s ease; }
@keyframes ovIn { from { opacity: 0; } to { opacity: 1; } }
.overlay-card { background: #fff; border-radius: 20px; padding: 2rem 1.5rem; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
.overlay-emoji { font-size: 52px; line-height: 1; margin-bottom: 0.5rem; }
.overlay-title { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 0.35rem; }
.overlay-sub { font-size: 13px; color: #6b7280; margin-bottom: 1.5rem; }
.overlay-btns { display: flex; flex-direction: column; gap: 8px; }
.link-min { margin-top: 0.9rem; background: none; border: none; color: #9ca3af; font-size: 11px; cursor: pointer; text-decoration: underline; }
/* Preguntas de comprensión: pantalla completa, botones grandes, sin marcar
   aciertos/fallos (es una evaluación, no un juego) */
.quiz { position: fixed; inset: 0; background: #f5f5f0; display: none; flex-direction: column; z-index: 90; padding: 1.1rem 1.1rem 1.4rem; }
.quiz.show { display: flex; animation: ovIn .18s ease; }
.quiz-top { max-width: 720px; width: 100%; margin: 0 auto; }
.quiz-prog-txt { font-size: 12.5px; color: #6b7280; text-align: center; margin-bottom: 0.5rem; }
.quiz-prog { background: #e5e7eb; border-radius: 6px; height: 6px; overflow: hidden; }
.quiz-prog-fill { height: 100%; background: #378ADD; border-radius: 6px; transition: width .3s; }
.quiz-mid { max-width: 720px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1rem; }
.quiz-preg-row { display: flex; align-items: flex-start; gap: 10px; }
.quiz-preg { font-size: clamp(20px, 3vw, 27px); font-weight: 600; color: #111; line-height: 1.4; flex: 1; }
.quiz-oir { flex-shrink: 0; background: #E0EFFA; color: #0C447C; border: none; border-radius: 12px; width: 46px; height: 46px; font-size: 20px; cursor: pointer; }
.quiz-oir:active { background: #cfe4f6; }
.quiz-ops { display: flex; flex-direction: column; gap: 12px; }
.quiz-op { width: 100%; text-align: left; padding: 18px 20px; border-radius: 16px; border: 1.5px solid #e5e7eb; background: #fff; font-size: clamp(16px, 2.2vw, 20px); color: #111; cursor: pointer; transition: border-color .12s, background .12s; }
.quiz-op:hover { border-color: #378ADD; }
.quiz-op:active { background: #f0f7fd; }
.quiz-op.elegida { border-color: #378ADD; background: #E0EFFA; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <div class="brand"><div class="brand-dot"></div>LectorIA</div>
    <button class="back-btn" onclick="window.location.href='panel.html'">← Panel</button>
  </div>

    <div class="avatar" id="avatar">?</div>
    <div class="alumno-info">

      <div class="alumno-sub" id="materia-linea">Sesión de lectura</div>
    </div>
    <span class="nivel-badge" id="nivel-badge">—</span>

  <div class="texto-card">
    <div class="reading" id="texto"></div>

  <div class="barra-inferior">

    <div class="prog-wrap" id="prog-wrap"><div class="prog-fill" id="prog"></div></div>

  <!-- Preguntas de comprensión tras la lectura (si el texto tiene banco) -->

    <div class="quiz-top">
      <div class="quiz-prog-txt" id="quiz-prog-txt">Pregunta 1</div>
      <div class="quiz-prog"><div class="quiz-prog-fill" id="quiz-prog-fill"></div></div>
    </div>
    <div class="quiz-mid">
      <div class="quiz-preg-row">
        <div class="quiz-preg" id="quiz-preg">—</div>
        <button class="quiz-oir" id="quiz-oir" onclick="oirPregunta()" title="Escuchar la pregunta">🔊</button>
      </div>
      <div class="quiz-ops" id="quiz-ops"></div>
    </div>
  </div>

  <!-- Fin de sesión: mensaje amable para el alumno, sin datos numéricos.
       El detalle (PPM, errores, niveles…) lo ve el docente en verificar/panel. -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="overlay-emoji" id="result-emoji">⭐</div>
      <div class="overlay-title" id="result-title">¡Muy bien!</div>
      <div class="overlay-sub" id="overlay-sub">Guardando la lectura…</div>
      <div class="overlay-btns">
        <button class="btn azul" id="reintentar-btn" onclick="reintentarGuardado()" style="display:none">🔄 Reintentar guardado</button>
        <button class="btn azul" id="verificar-btn" onclick="irVerificar()" disabled>✔ Verificar sesión</button>
        <button class="btn gris" onclick="window.location.href='panel.html'">Volver al panel</button>
      </div>
      <button class="link-min" id="dbg-btn" onclick="descargarDiag()">Descargar diagnóstico</button>
    </div>
  </div>
</div>

<script>
console.log("LectorIA · " + MotorLectura.VERSION + " (motor compartido en motor.js)");
// ─── Supabase (URL y clave en config.js) ─────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── Usuario autenticado (RLS exige sesión iniciada) ─────────────────────────
let usuarioActual = null;
sb.auth.getSession().then(({ data }) => {
  if (!data.session) { window.location.href = "login.html"; return; }
  usuarioActual = data.session.user;
});

// ─── Whisper local (motor de reconocimiento propio, sustituye a Azure) ────────
// El navegador graba la lectura completa y la envía al servidor Whisper, que
// devuelve las palabras transcritas A CIEGAS con la misma forma que Azure
// (Word/Offset/Duration/PronunciationAssessment) para que motor.js las analice.
async function transcribirConWhisper(blob) {
  if (!blob) return [];
  // El endpoint /evaluar exige sesión válida: mandamos el JWT de Supabase,
  // que el servidor verifica contra ${SUPABASE_URL}/auth/v1/user.
  const { data: sesionData } = await sb.auth.getSession();
  const token = sesionData?.session?.access_token;
  if (!token) throw new Error("Tu sesión ha caducado. Vuelve a iniciar sesión.");
  const fd = new FormData();
  fd.append("audio", blob, "lectura.webm");
  // Timeout de 2 min: si el túnel/servidor se cuelga, abortamos en vez de
  // dejar el botón en "Finalizando..." para siempre.
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try {
    res = await fetch(WHISPER_API_URL + "/evaluar", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token },
      body: fd,
      signal: ctrl.signal,
    });
  } catch (e) {
    throw new Error(ctrl.signal.aborted
      ? "El servidor de reconocimiento no respondió en 2 minutos."
      : "No hay conexión con el servidor de reconocimiento.");
  } finally {
    clearTimeout(t);
  }
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    throw new Error("El servidor de reconocimiento falló: " + (txt || res.status));
  }
  const data = await res.json();
  return data.allWords || [];
}

// ─── Lecturas ─────────────────────────────────────────────────────────────────
const lecturas = {
"1P": [
{ id: "1p-01", titulo: "Los animales domésticos", materia: "Ciencias Naturales", texto: "Los animales domésticos viven con las personas en casa. El perro y el gato son los más comunes. El perro ladra y el gato maúlla. Necesitan comida, agua y cariño cada día. Algunos animales domésticos nos ayudan, como el perro guía que acompaña a personas con problemas de visión. Debemos cuidarlos y quererlos siempre." },
{ id: "1p-02", titulo: "Mi familia", materia: "Lengua", texto: "En mi familia somos cuatro personas. Mi papá se llama Carlos y trabaja de médico. Mi mamá se llama Ana y es maestra. Mi hermana pequeña se llama Lucía y tiene tres años. Los fines de semana salimos juntos al parque. Me gusta mucho estar con mi familia porque nos queremos mucho." },
{ id: "1p-03", titulo: "Las frutas", materia: "Entorno", texto: "Las frutas son alimentos muy sanos y deliciosos. Las hay de muchos colores: las manzanas son rojas o verdes, los plátanos son amarillos y las naranjas son naranjas. Tienen vitaminas que nos ayudan a crecer sanos y fuertes. Debemos comer fruta todos los días. En España se cultivan muchas frutas como naranjas, fresas y melones." },
{ id: "1p-04", titulo: "El sol y la luna", materia: "Ciencias Naturales", texto: "El sol es una estrella muy grande que nos da luz y calor. Sale por la mañana y se pone por la tarde. La luna sale por la noche y nos alumbra cuando está oscuro. A veces la luna es redonda y se llama luna llena. El sol y la luna son muy importantes para todos los seres vivos de la Tierra." },
{ id: "1p-05", titulo: "Los colores", materia: "Plástica", texto: "Los colores están en todas partes. El cielo es azul, la hierba es verde y el sol es amarillo. Cuando mezclamos el azul y el amarillo obtenemos el verde. Con el rojo y el amarillo hacemos el naranja. Los colores primarios son el rojo, el amarillo y el azul. Con ellos podemos crear todos los demás colores del mundo." },
{ id: "1p-06", titulo: "El cuerpo humano", materia: "Ciencias Naturales", texto: "Nuestro cuerpo tiene muchas partes. La cabeza, el tronco y las extremidades son las partes principales. Con los brazos cogemos las cosas y con las piernas andamos y corremos. Los ojos nos sirven para ver y los oídos para escuchar. Debemos cuidar nuestro cuerpo comiendo bien, haciendo ejercicio y durmiendo las horas necesarias cada día." },
{ id: "1p-07", titulo: "Las estaciones", materia: "Ciencias Naturales", texto: "El año tiene cuatro estaciones. En primavera hace calor y florecen las plantas. En verano el sol brilla mucho y vamos a la playa. En otoño las hojas de los árboles se vuelven marrones y caen al suelo. En invierno hace mucho frío y a veces nieva. Cada estación es diferente y tiene cosas bonitas que podemos disfrutar." },
{ id: "1p-08", titulo: "Mi cole", materia: "Lengua", texto: "Mi colegio se llama Rosaleda. Tiene muchas clases, un patio grande y una biblioteca. Por la mañana saludo a mis amigos y a mi maestra. En clase aprendemos a leer, a escribir y a sumar. En el recreo jugamos y merendamos. Me gusta mucho ir al colegio porque aprendo cosas nuevas cada día y me lo paso muy bien." },
{ id: "1p-09", titulo: "Los medios de transporte", materia: "Conocimiento del Medio", texto: "Hay muchos medios de transporte. El coche y el autobús van por la carretera. El tren va por las vías. El avión vuela por el cielo y el barco navega por el mar. Algunos transportes llevan personas y otros llevan mercancías. Para ir al colegio yo voy andando porque vivo cerca. Es bueno caminar para cuidar el medio ambiente." },
{ id: "1p-10", titulo: "El agua en casa", materia: "Ciencias Naturales", texto: "El agua es muy importante en nuestra casa. La usamos para beber, para cocinar y para ducharnos. Cuando abrimos el grifo sale agua limpia. Debemos cerrar el grifo cuando nos lavamos los dientes para no malgastarla. El agua es un bien muy valioso que hay que cuidar. Sin agua no podrían vivir las personas, los animales ni las plantas." },
{ id: "1p-11", titulo: "Los animales salvajes", materia: "Ciencias Naturales", texto: "Los animales salvajes viven en la naturaleza. El león vive en la sabana africana y es el rey de los animales. El elefante es el animal terrestre más grande del mundo. Los delfines viven en el mar y son muy inteligentes. Debemos respetar a todos los animales salvajes y no cazarlos. Los zoológicos nos ayudan a conocerlos y protegerlos." },
{ id: "1p-12", titulo: "El tiempo atmosférico", materia: "Ciencias Naturales", texto: "Cada día el tiempo puede ser diferente. A veces hace sol y otras veces llueve. Cuando hay nubes oscuras puede haber tormenta con rayos y truenos. En invierno puede nevar y todo se pone blanco. Los meteorólogos estudian el tiempo y nos avisan en la televisión. Es importante mirar el tiempo antes de salir para saber cómo vestirnos." },
{ id: "1p-13", titulo: "Los números", materia: "Matemáticas", texto: "Los números nos ayudan a contar y a medir. Con ellos sabemos cuántos años tenemos, cuántos alumnos hay en clase o cuánto cuesta algo en la tienda. Los números pares terminan en cero, dos, cuatro, seis u ocho. Los impares terminan en uno, tres, cinco, siete o nueve. Las matemáticas están en todas partes y las usamos todos los días sin darnos cuenta." },

{ id: "1p-15", titulo: "Los sentidos", materia: "Ciencias Naturales", texto: "Las personas tenemos cinco sentidos. Con los ojos vemos los colores y las formas. Con los oídos escuchamos los sonidos y la música. Con la nariz olemos las flores y la comida. Con la boca y la lengua saboreamos los alimentos. Con las manos y la piel tocamos y notamos si algo está frío o caliente. Los cinco sentidos nos ayudan a conocer el mundo." }

"2P": [
{ id: "2p-01", titulo: "Las abejas", materia: "Ciencias Naturales", texto: "Las abejas son insectos que viven en colonias. Dentro de la colmena trabajan juntas para producir miel. La abeja reina pone huevos y las obreras cuidan la colmena. Recogen el néctar de las flores y lo transforman en miel. También ayudan a las plantas a reproducirse cuando llevan el polen de unas flores a otras." },
{ id: "2p-02", titulo: "El agua", materia: "Ciencias Naturales", texto: "El agua es un elemento muy importante para todos los seres vivos. Las personas, los animales y las plantas necesitan agua para vivir. El agua que bebemos viene de los ríos y los embalses. Antes de llegar a nuestra casa se limpia en las potabilizadoras. Debemos ahorrar agua y no malgastarla. Podemos cerrar el grifo mientras nos lavamos los dientes. El agua es un bien muy valioso que hay que cuidar." },

{ id: "2p-07", titulo: "El sistema solar", materia: "Ciencias Naturales", texto: "El sistema solar está formado por el Sol y ocho planetas que giran a su alrededor. Los planetas son Mercurio, Venus, la Tierra, Marte, Júpiter, Saturno, Urano y Neptuno. La Tierra es el único planeta donde sabemos que existe vida. Júpiter es el planeta más grande de todos. Saturno tiene unos anillos muy bonitos formados por hielo y roca. La Luna es el satélite natural de la Tierra y gira a su alrededor cada mes." },
