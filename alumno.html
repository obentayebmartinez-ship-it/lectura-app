<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LectorIA — Historial</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; padding: 1.5rem; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
    .back-btn { font-size: 12px; color: #6b7280; border: 0.5px solid #d1d5db; border-radius: 8px; padding: 5px 12px; background: #fff; cursor: pointer; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; }
    .brand-name { font-size: 15px; font-weight: 500; color: #111; }
    .alumno-hero { background: #fff; border: 0.5px solid #e5e7eb; border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 14px; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #E1F5EE; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; color: #0F6E56; flex-shrink: 0; }
    .alumno-nombre { font-size: 17px; font-weight: 500; color: #111; }
    .alumno-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; margin-left: auto; }
    .badge-ok { background: #E1F5EE; color: #0F6E56; }
    .badge-warn { background: #FAEEDA; color: #633806; }
    .badge-bad { background: #FCEBEB; color: #791F1F; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.25rem; }
    .card { background: #fff; border: 0.5px solid #e5e7eb; border-radius: 14px; padding: 1.25rem; }
    .metric-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .metric-value { font-size: 26px; font-weight: 500; color: #111; }
    .metric-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .card-title { font-size: 14px; font-weight: 500; color: #111; margin-bottom: 1rem; }
    .sesion-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #f3f4f6; font-size: 13px; }
    .sesion-fila:last-child { border-bottom: none; }
    .sesion-titulo { font-weight: 500; color: #111; font-size: 13px; }
    .sesion-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .sesion-derecha { text-align: right; }
    .sesion-ppm { font-size: 15px; font-weight: 500; color: #111; }
    .sesion-errores { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .ppm-chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .ppm-ok { background: #E1F5EE; color: #0F6E56; }
    .ppm-warn { background: #FAEEDA; color: #633806; }
    .ppm-bad { background: #FCEBEB; color: #791F1F; }
    .btn-pdf { font-size: 12px; padding: 8px 16px; border-radius: 8px; border: 0.5px solid #e5e7eb; background: #fff; color: #374151; cursor: pointer; margin-top: 1rem; }
    .loading { text-align: center; color: #9ca3af; font-size: 13px; padding: 2rem; }
    .objetivo-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b7280; margin-top: 0.5rem; }
    .objetivo-dot { width: 20px; height: 2px; background: #d1d5db; border-top: 2px dashed #d1d5db; }
    @media (max-width: 600px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='panel.html'">← Panel</button>
  <div class="brand"><div class="brand-dot"></div><span class="brand-name">LectorIA</span></div>
</div>

<div class="alumno-hero" id="alumno-hero">
  <div class="loading">Cargando...</div>
</div>

<div class="grid-3">
  <div class="card">
    <div class="metric-label">PPM actual</div>
    <div class="metric-value" id="ppm-actual">—</div>
    <div class="metric-sub">última sesión</div>
  </div>
  <div class="card">
    <div class="metric-label">Objetivo del curso</div>
    <div class="metric-value" id="ppm-objetivo">—</div>
    <div class="metric-sub">palabras por minuto</div>
  </div>
  <div class="card">
    <div class="metric-label">Lecturas completadas</div>
    <div class="metric-value" id="lecturas-completadas">—</div>
    <div class="metric-sub" id="lecturas-sub">de 10 lecturas</div>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem;">
  <div class="card">
    <div class="card-title">Evolución PPM</div>
    <canvas id="chartEvolucion" height="200"></canvas>
    <div class="objetivo-line"><div class="objetivo-dot"></div>Objetivo del curso</div>
  </div>
  <div class="card">
    <div class="card-title">Historial de lecturas</div>
    <div id="lista-sesiones"><div class="loading">Cargando...</div></div>
    <button class="btn-pdf" onclick="generarPDF()">📄 Descargar informe PDF</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mvwuyxrlkyikfgxzokxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_SNSZe5l2R3jcxiHxcxEqgg_XBrW-Xvi";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const OBJETIVOS = { "1P": 65, "2P": 90, "3P": 105, "4P": 115, "5P": 125, "6P": 135 };
const TEXTOS = {
  "1p-01": "Los animales domésticos", "1p-02": "Mi familia", "1p-03": "Las frutas",
  "1p-04": "El sol y la luna", "1p-05": "Los colores", "1p-06": "El cuerpo humano",
  "1p-07": "Las estaciones", "1p-08": "Mi cole", "1p-09": "Los medios de transporte", "1p-10": "El agua en casa",
  "2p-01": "Las abejas", "2p-02": "El agua", "2p-03": "El mercado",
  "2p-04": "Los dinosaurios", "2p-05": "La biblioteca", "2p-06": "Las plantas",
  "2p-07": "El sistema solar", "2p-08": "La alimentación saludable", "2p-09": "Los oficios", "2p-10": "El reciclaje"
};

const params = new URLSearchParams(window.location.search);
const alumnoNombre = params.get("alumno") || "";
const alumnoCurso = params.get("curso") || "2P";

let todasLasSesiones = [];

async function init() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = "login.html"; return; }

  const iniciales = alumnoNombre.split(" ").map(n => n[0]).filter(Boolean).join("").substring(0,2).toUpperCase();
  const objetivo = OBJETIVOS[alumnoCurso] || 90;
  document.getElementById("ppm-objetivo").textContent = objetivo;

  const { data: sesiones } = await sb.from("sesiones")
    .select("*")
    .eq("alumno", alumnoNombre)
    .order("fecha", { ascending: true });

  if (!sesiones || sesiones.length === 0) {
    document.getElementById("alumno-hero").innerHTML = `
      <div class="avatar">${iniciales}</div>
      <div><div class="alumno-nombre">${alumnoNombre}</div><div class="alumno-meta">${alumnoCurso} · Sin sesiones todavía</div></div>`;
    document.getElementById("lista-sesiones").innerHTML = "<div class='loading'>No hay lecturas todavía</div>";
    return;
  }

  todasLasSesiones = sesiones;
  const ultima = sesiones[sesiones.length - 1];
  const ppmActual = ultima.ppm;
  const badge = ppmActual >= objetivo ? "badge-ok" : ppmActual >= objetivo * 0.8 ? "badge-warn" : "badge-bad";
  const estado = ppmActual >= objetivo ? "En nivel" : ppmActual >= objetivo * 0.8 ? "Cerca" : "Necesita apoyo";

  document.getElementById("alumno-hero").innerHTML = `
    <div class="avatar">${iniciales}</div>
    <div>
      <div class="alumno-nombre">${alumnoNombre}</div>
      <div class="alumno-meta">${alumnoCurso} · ${sesiones.length} sesión(es) completada(s)</div>
    </div>
    <span class="badge ${badge}">${estado}</span>`;

  document.getElementById("ppm-actual").textContent = ppmActual;
  document.getElementById("lecturas-completadas").textContent = sesiones.length;
  document.getElementById("lecturas-sub").textContent = "de 10 lecturas";

  const labels = sesiones.map((s, i) => "L" + (i + 1));
  const ppms = sesiones.map(s => s.ppm);
  new Chart(document.getElementById("chartEvolucion"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: ppms,
        borderColor: "#1D9E75",
        backgroundColor: "rgba(29,158,117,0.08)",
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: ppms.map(p => p >= objetivo ? "#1D9E75" : p >= objetivo * 0.8 ? "#EF9F27" : "#E24B4A"),
        fill: true,
        tension: 0.3
      }, {
        data: Array(labels.length).fill(objetivo),
        borderColor: "#d1d5db",
        borderWidth: 1.5,
        borderDash: [5, 4],
        pointRadius: 0,
        fill: false
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: Math.max(0, Math.min(...ppms) - 20), ticks: { font: { size: 11 }, color: "#9ca3af" }, grid: { color: "rgba(0,0,0,0.04)" } },
        x: { ticks: { font: { size: 11 }, color: "#9ca3af" }, grid: { display: false } }
      }
    }
  });

  document.getElementById("lista-sesiones").innerHTML = sesiones.map((s, i) => {
    const titulo = TEXTOS[s.texto_id] || s.texto_id || "Lectura " + (i+1);
    const fecha = new Date(s.fecha).toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" });
    const chip = s.ppm >= objetivo ? "ppm-ok" : s.ppm >= objetivo * 0.8 ? "ppm-warn" : "ppm-bad";
    const totalErrores = (s.omisiones || 0) + (s.sustituciones || 0) + (s.repeticiones || 0);
    return `
      <div class="sesion-fila">
        <div>
          <div class="sesion-titulo">L${i+1}. ${titulo}</div>
          <div class="sesion-meta">${fecha} · ${s.precision}% precisión · ${totalErrores} errores</div>
        </div>
        <div class="sesion-derecha">
          <span class="ppm-chip ${chip}">${s.ppm} PPM</span>
        </div>
      </div>`;
  }).join("");
}

function generarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const objetivo = OBJETIVOS[alumnoCurso] || 90;
  const ultima = todasLasSesiones[todasLasSesiones.length - 1];
  const fecha = new Date().toLocaleDateString("es-ES");
  const estado = ultima.ppm >= objetivo ? "En nivel" : ultima.ppm >= objetivo * 0.8 ? "Cerca del nivel" : "Necesita apoyo";
  const recomendacion = ultima.ppm >= objetivo
    ? "El alumno ha alcanzado el nivel esperado. Se recomienda mantener la práctica y avanzar a textos de mayor complejidad."
    : ultima.ppm >= objetivo * 0.8
    ? "El alumno está cerca del objetivo. Se recomienda práctica diaria de 10 minutos con lecturas de su nivel."
    : "El alumno necesita apoyo adicional. Se recomienda sesiones de lectura guiada con el orientador educativo.";

  doc.setFillColor(29, 158, 117);
  doc.rect(0, 0, 210, 28, "F");
  doc.setTextColor(255,255,255);
  doc.setFontSize(18); doc.setFont("helvetica","bold");
  doc.text("LectorIA", 14, 12);
  doc.setFontSize(11); doc.setFont("helvetica","normal");
  doc.text("Informe de progreso lector", 14, 21);
  doc.text(fecha, 196, 21, { align: "right" });

  doc.setTextColor(17,17,17);
  doc.setFontSize(16); doc.setFont("helvetica","bold");
  doc.text(alumnoNombre, 14, 42);
  doc.setFontSize(11); doc.setFont("helvetica","normal");
  doc.setTextColor(107,114,128);
  doc.text(`${alumnoCurso} · ${todasLasSesiones.length} lectura(s) completada(s)`, 14, 50);

  doc.setFillColor(249,250,251);
  doc.roundedRect(14, 58, 55, 28, 3, 3, "F");
  doc.roundedRect(76, 58, 55, 28, 3, 3, "F");
  doc.roundedRect(138, 58, 58, 28, 3, 3, "F");
  doc.setTextColor(107,114,128); doc.setFontSize(8);
  doc.text("PPM ACTUAL", 18, 65); doc.text("OBJETIVO", 80, 65); doc.text("ESTADO", 142, 65);
  doc.setTextColor(17,17,17); doc.setFontSize(20); doc.setFont("helvetica","bold");
  doc.text(String(ultima.ppm), 18, 80);
  doc.text(String(objetivo), 80, 80);
  doc.setFontSize(11);
  doc.text(estado, 142, 78);

  doc.setDrawColor(229,231,235); doc.line(14, 94, 196, 94);
  doc.setTextColor(17,17,17); doc.setFontSize(12); doc.setFont("helvetica","bold");
  doc.text("Historial de lecturas", 14, 104);

  doc.setFontSize(9); doc.setFont("helvetica","normal");
  doc.setTextColor(107,114,128);
  doc.text("Lectura", 14, 113); doc.text("PPM", 120, 113);
  doc.text("Precisión", 145, 113); doc.text("Errores", 175, 113);

  todasLasSesiones.forEach((s, i) => {
    const y = 121 + i * 10;
    const titulo = TEXTOS[s.texto_id] || "Lectura " + (i+1);
    const totalErr = (s.omisiones||0) + (s.sustituciones||0) + (s.repeticiones||0);
    doc.setTextColor(55,65,81);
    doc.text(`L${i+1}. ${titulo.substring(0, 30)}`, 14, y);
    doc.text(String(s.ppm), 120, y);
    doc.text(s.precision + "%", 145, y);
    doc.text(String(totalErr), 175, y);
  });

  const yRec = 125 + todasLasSesiones.length * 10;
  doc.setFillColor(240,253,244);
  doc.roundedRect(14, yRec, 182, 28, 3, 3, "F");
  doc.setTextColor(15,110,86); doc.setFontSize(10); doc.setFont("helvetica","bold");
  doc.text("Recomendación", 20, yRec + 10);
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.text(doc.splitTextToSize(recomendacion, 170), 20, yRec + 18);

  doc.setTextColor(156,163,175); doc.setFontSize(8);
  doc.text("Generado por LectorIA · Plataforma de estimulación lectora", 105, 285, { align: "center" });
  doc.save(`informe_${alumnoNombre.replace(/ /g,"_")}_${fecha.replace(/\//g,"-")}.pdf`);
}

init();
</script>
</body>
</html>
