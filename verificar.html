<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LectorIA — Verificación</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1" integrity="sha384-fx4y4cDx8NYfissnVzdGJY3yVXWY3rn5ab5HTUjpvgT35oDiyAbjjqnLhnRmESNE" crossorigin="anonymous"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f0; padding: 1.5rem; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .back-btn { font-size: 12px; color: #6b7280; border: 0.5px solid #d1d5db; border-radius: 8px; padding: 5px 12px; background: #fff; cursor: pointer; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #378ADD; }
  .brand-name { font-size: 15px; font-weight: 500; color: #111; }
  .modo-badge { font-size: 10px; background: #E0EFFA; color: #0C447C; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 0.5px solid #e5e7eb; border-radius: 14px; padding: 1.25rem; margin-bottom: 14px; }
  .card-title { font-size: 14px; font-weight: 500; color: #111; margin-bottom: 0.75rem; }
  .sesion-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #E1F5EE; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 13px; color: #0F6E56; flex-shrink: 0; }
  .sesion-nombre { font-size: 15px; font-weight: 500; color: #111; }
  .sesion-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .chip { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; background: #f3f4f6; color: #374151; }
  audio { width: 100%; margin-top: 0.75rem; height: 36px; }
  .leyenda-tit { font-size: 11px; color: #9ca3af; margin: 1rem 0 0.4rem; }
  .leyenda { display: flex; gap: 6px; flex-wrap: wrap; }
  .ley-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #6b7280; font-family: inherit; background: #fff; border: 0.5px solid #e5e7eb; border-radius: 20px; padding: 4px 10px; cursor: pointer; transition: background .15s, border-color .15s; }
  .ley-item:hover { background: #f9fafb; border-color: #d1d5db; }
  .ley-item.sel { background: #f3f4f6; border-color: #9ca3af; color: #111; font-weight: 500; }
  .ley-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .ley-exp { display: none; position: relative; margin-top: 0.75rem; font-size: 13px; color: #374151; line-height: 1.5; background: #fff; border: 0.5px solid #e5e7eb; border-left: 3px solid #ccc; border-radius: 10px; padding: 13px 40px 13px 15px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
  .ley-exp.show { display: block; }
  .ley-exp-cab { margin-bottom: 5px; }
  .ley-exp-cab b { color: #111; font-weight: 600; font-size: 14px; }
  .ley-exp-def { color: #374151; }
  .ley-exp-ej { color: #6b7280; font-style: italic; margin-top: 5px; }
  .ley-exp-ej .ej-lab { font-style: normal; font-weight: 500; color: #9ca3af; margin-right: 3px; }
  .ley-exp-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: middle; }
  .ley-exp-close { position: absolute; top: 9px; right: 9px; width: 24px; height: 24px; border: none; background: #f3f4f6; color: #6b7280; border-radius: 7px; font-size: 16px; line-height: 1; cursor: pointer; transition: background .15s; }
  .ley-exp-close:hover { background: #e5e7eb; color: #374151; }
  .reading { font-size: 18px; line-height: 2.1; color: #111; }
  .word { display: inline; border-radius: 3px; padding: 1px 4px; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .word:hover { outline: 1.5px solid #378ADD; }
  .word.done { color: #9ca3af; }
  .word.omision { background: #FCEBEB; color: #791F1F; }
  .word.sustitucion { background: #FAEEDA; color: #633806; }
  .word.repeticion { background: #EEEDFE; color: #3C3489; }
  .word.inversion { background: #E0EFFA; color: #0C447C; }
  .word.rectificacion { background: #FDF3E7; color: #9A6A1F; }
  .word.vacilacion { color: #92600A; text-decoration: underline wavy #E0A845; text-underline-offset: 2px; }
  .word.dudosa { color: #9ca3af; text-decoration: underline dotted #d1d5db; }
  .word.adicion { background: #FBE9F1; color: #86225B; font-style: italic; border: 0.5px dashed #E29CC0; }
  .word.editada { outline: 1.5px dashed #1D9E75; }
  /* Menú flotante de corrección */
  #menu { position: absolute; z-index: 100; background: #fff; border: 0.5px solid #d1d5db; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.14); padding: 10px; display: none; width: 250px; }
  #menu.show { display: block; }
  .menu-word { font-size: 13px; font-weight: 600; color: #111; margin-bottom: 2px; }
  .menu-sub { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
  .menu-play { width: 100%; padding: 8px; border-radius: 8px; border: none; background: #378ADD; color: #fff; font-size: 12px; font-weight: 500; cursor: pointer; margin-bottom: 8px; }
  .menu-play:disabled { background: #d1d5db; cursor: default; }
  .menu-opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opt { font-size: 11px; padding: 4px 9px; border-radius: 8px; border: 0.5px solid #e5e7eb; background: #fff; cursor: pointer; color: #374151; }
  .opt.activa { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; font-weight: 600; }
  /* Hoja de registro */
  .grupo { margin-bottom: 1rem; }
  .grupo-nombre { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .dim-fila { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 0.5px solid #f3f4f6; }
  .dim-fila:last-child { border-bottom: none; }
  .dim-label { font-size: 13px; color: #111; }
  .dim-sub { font-size: 10px; color: #9ca3af; }
  .niveles { display: flex; gap: 4px; }
  .nivel { width: 34px; text-align: center; font-size: 11px; padding: 5px 0; border-radius: 8px; border: 0.5px solid #e5e7eb; background: #fff; cursor: pointer; color: #6b7280; }
  .nivel.activo-1 { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; font-weight: 600; }
  .nivel.activo-2 { border-color: #EF9F27; background: #FAEEDA; color: #633806; font-weight: 600; }
  .nivel.activo-3 { border-color: #E24B4A; background: #FCEBEB; color: #791F1F; font-weight: 600; }
  .nivel.activo-pos-1 { border-color: #E24B4A; background: #FCEBEB; color: #791F1F; font-weight: 600; }
  .nivel.activo-pos-2 { border-color: #EF9F27; background: #FAEEDA; color: #633806; font-weight: 600; }
  .nivel.activo-pos-3 { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; font-weight: 600; }
  .nota { font-size: 11px; color: #9ca3af; margin-top: 0.75rem; line-height: 1.5; }
  .btn-guardar { width: 100%; padding: 13px; border-radius: 12px; border: none; background: #1D9E75; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
  .btn-guardar:disabled { background: #9ca3af; cursor: default; }
  .guardado-ok { font-size: 12px; color: #1D9E75; text-align: center; margin-top: 8px; display: none; }
  .guardado-ok.show { display: block; }
  /* Niveles con ETIQUETA (Requiere trabajo · Reforzar · En nivel) + criterios */
  .dim-fila { flex-direction: column; align-items: stretch; gap: 6px; }
  .dim-cab { display: flex; align-items: center; gap: 4px; }
  .dim-medida { font-size: 10.5px; color: #6b7280; margin-top: 1px; }
  .dim-ayuda { border: none; background: none; color: #b6bcc6; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
  .dim-ayuda:hover { color: #378ADD; }
  .dim-criterio { font-size: 11px; color: #4b5563; background: #f9fafb; border-left: 2px solid #cbd5e1; border-radius: 6px; padding: 7px 10px; margin: 2px 0 2px; line-height: 1.5; }
  .niveles-lbl { display: flex; gap: 5px; }
  .nivel-lbl { flex: 1; text-align: center; font-size: 11px; padding: 6px 4px; border-radius: 8px; border: 0.5px solid #e5e7eb; background: #fff; cursor: pointer; color: #9ca3af; white-space: nowrap; transition: all .12s; }
  .nivel-lbl:hover { border-color: #cbd5e1; }
  .nivel-lbl.activo.niv-mal  { border-color: #E24B4A; background: #FCEBEB; color: #791F1F; font-weight: 600; }
  .nivel-lbl.activo.niv-med  { border-color: #EF9F27; background: #FAEEDA; color: #633806; font-weight: 600; }
  .nivel-lbl.activo.niv-bien { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; font-weight: 600; }
  .loading { text-align: center; color: #9ca3af; font-size: 13px; padding: 2rem; }
  /* Detalle del test de comprensión */
  .comp-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid #f3f4f6; align-items: flex-start; }
  .comp-item:last-child { border-bottom: none; }
  .comp-icon { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; margin-top: 1px; }
  .comp-item.ok .comp-icon { background: #1D9E75; }
  .comp-item.ko .comp-icon { background: #E24B4A; }
  .comp-p { font-size: 13px; color: #111; font-weight: 500; }
  .comp-resp { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .comp-corr { font-size: 12px; color: #0F6E56; margin-top: 1px; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.location.href='panel.html'">← Panel</button>
  <div class="brand"><div class="brand-dot"></div><span class="brand-name">LectorIA · Verificación docente</span></div>
  <span class="modo-badge">La IA propone, tú confirmas</span>
</div>

<div id="contenido"><div class="loading">Cargando sesión...</div></div>

<div id="menu">
  <div class="menu-word" id="menu-word">—</div>
  <div class="menu-sub" id="menu-sub">—</div>
  <button class="menu-play" id="menu-play" onclick="reproducirSeleccion()">▶ Escuchar este momento</button>
  <div class="menu-opts" id="menu-opts"></div>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params   = new URLSearchParams(window.location.search);
const sesionId = params.get("sesion") || "";

// ─── Tipos de palabra: etiqueta, clase CSS y si el docente puede asignarlos ──
const TIPOS = {
  correcta:       { label: "Correcta",       cls: "done",          asignable: true },
  omision:        { label: "Omisión",        cls: "omision",       asignable: true },
  omision_dudosa: { label: "Omisión dudosa", cls: "dudosa",        asignable: false },
  no_leida:       { label: "No leída",       cls: "",              asignable: false },
  sustitucion:    { label: "Sustitución",    cls: "sustitucion",   asignable: true },
  inversion:      { label: "Inversión",      cls: "inversion",     asignable: true },
  adicion:        { label: "Adición",        cls: "adicion",       asignable: true },
  repeticion:     { label: "Repetición",     cls: "repeticion",    asignable: true },
  rectificacion:  { label: "Rectificación",  cls: "rectificacion", asignable: true },
  vacilacion:     { label: "Vacilación",     cls: "vacilacion",    asignable: true }
};

// ─── Leyenda interactiva: color + definición breve + ejemplo de cada error ───
const LEYENDA = [
  { tipo: "omision",       color: "#F09595", def: "El alumno se salta una palabra del texto y no llega a leerla.", ej: "en «las manzanas rojas» lee «las rojas»." },
  { tipo: "sustitucion",   color: "#EF9F27", def: "Lee una palabra distinta a la que pone el texto.", ej: "lee «caza» donde pone «casa»." },
  { tipo: "inversion",     color: "#7FB5E6", def: "Cambia el orden de letras o sílabas dentro de la palabra.", ej: "lee «prado» donde pone «pardo»." },
  { tipo: "repeticion",    color: "#AFA9EC", def: "Vuelve a leer una palabra o sílaba que ya había leído.", ej: "«la… la casa»." },
  { tipo: "rectificacion", color: "#E8C083", def: "Se equivoca al leer y se corrige él mismo a continuación.", ej: "«el pe… perro»." },
  { tipo: "vacilacion",    color: "#E0A845", def: "Duda o hace una pausa larga antes de una palabra, aunque acabe leyéndola bien.", ej: "«… … elefante»." },
  { tipo: "adicion",       color: "#E29CC0", def: "Añade una palabra o sílaba que no está en el texto.", ej: "lee «la gran casa» donde pone «la casa»." }
];

// ─── Hoja de registro: dimensiones y cálculo automático de niveles ───────────
// positivo:true → nivel alto es BUENO (velocidad, entonación, comprensión).
// En el resto el nivel refleja la intensidad de la dificultad observada.
const DIMENSIONES = [
  { grupo: "Fluidez lectora", items: [
    { key: "silabeo",           label: "Silabeo",             manual: true,  sub: "solo observación directa" },
    { key: "pausas_entonacion", label: "Pausas y entonación", positivo: true, sub: "entonación y ritmo · escucha el audio para valorar" },
    { key: "vacilacion",        label: "Vacilación",          tipo: "vacilacion" },
    { key: "rectificacion",     label: "Rectificación",       tipo: "rectificacion" },
    { key: "repeticion",        label: "Repetición",          tipo: "repeticion" },
    { key: "velocidad",         label: "Velocidad",           positivo: true, sub: "PPM vs objetivo del curso" }
  ]},
  { grupo: "Exactitud lectora", items: [
    { key: "sustitucion", label: "Sustitución", tipo: "sustitucion" },
    { key: "omisiones",   label: "Omisiones",   tipo: "omision" },
    { key: "inversion",   label: "Inversión",   tipo: "inversion" },
    { key: "adicion",     label: "Adición",     tipo: "adicion" },
    { key: "rotacion",    label: "Rotación (b/d, p/q)", manual: true, sub: "error visual: solo observación directa" }
  ]},
  { grupo: "Comprensión y expresión", items: [
    { key: "comprension", label: "Comprensión lectora", manual: true, positivo: true, sub: "test de preguntas tras la lectura · puedes ajustarlo" }
  ]}
];

// ─── Los tres niveles: etiqueta clara + clase de color (1 peor → 3 mejor) ─────
const NIVEL_INFO = {
  1: { label: "Requiere trabajo", cls: "niv-mal"  },
  2: { label: "Reforzar",         cls: "niv-med"  },
  3: { label: "En nivel",         cls: "niv-bien" }
};

// ─── Cómo se decide cada nivel (se muestra al pulsar la ⓘ de cada fila) ───────
const CRIT_ERROR = "Se mide por frecuencia: veces que aparece por cada 100 palabras leídas. " +
  "«En nivel» ≤1 · «Reforzar» entre 1 y 4 · «Requiere trabajo» más de 4. La IA lo propone y tú lo confirmas o lo cambias.";
const COMO_SE_MIDE = {
  velocidad: "Velocidad lectora (PPM) frente al objetivo del curso. «En nivel» ≥100% del objetivo · «Reforzar» 80–99% · «Requiere trabajo» menos del 80%.",
  pausas_entonacion: "Entonación y ritmo al leer. El reconocedor actual no la mide solo: valórala tú escuchando el audio.",
  silabeo: "Si lee sílaba a sílaba en vez de palabras enteras. Se valora por observación directa durante la lectura.",
  rotacion: "Confusión de letras espejo (b/d, p/q). Es un error visual: se valora por observación directa.",
  comprension: "Cuánto entiende de lo leído. Se mide con las preguntas tipo test que responde el alumno al terminar: «En nivel» ≥80% de aciertos · «Reforzar» 50–79% · «Requiere trabajo» menos del 50%. Si la lectura no tenía preguntas, valóralo tú.",
  vacilacion: CRIT_ERROR, rectificacion: CRIT_ERROR, repeticion: CRIT_ERROR,
  sustitucion: CRIT_ERROR, omisiones: CRIT_ERROR, inversion: CRIT_ERROR, adicion: CRIT_ERROR
};

let sesion = null;
let palabras = [];
let niveles = {};          // {key: 1|2|3}
let medidas = {};          // {key: texto con la medición real de esta lectura}
let nivelesTocados = new Set();
let seleccionada = null;
let audioEl = null;
let hayCambios = false;
let leyExpSel = null;      // tipo de error explicado en la leyenda (o null)

// ─── Carga ───────────────────────────────────────────────────────────────────
async function init() {
  if (!sesionId) { document.getElementById("contenido").innerHTML = "<div class='loading'>Falta el parámetro de sesión</div>"; return; }

  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = "login.html"; return; }

  const { data: s, error: eS } = await sb.from("sesiones").select("*").eq("id", sesionId).single();
  if (eS || !s) { document.getElementById("contenido").innerHTML = "<div class='loading'>Sesión no encontrada</div>"; return; }
  sesion = s;

  const { data: pal, error: eP } = await sb.from("sesion_palabras")
    .select("*").eq("sesion_id", sesionId).order("id", { ascending: true });
  if (eP || !pal || pal.length === 0) {
    document.getElementById("contenido").innerHTML = "<div class='loading'>Esta sesión no tiene detalle palabra a palabra (es anterior a la v3.2)</div>";
    return;
  }
  palabras = pal;

  if (sesion.audio_path) {
    const { data: urlData } = await sb.storage.from("audios").createSignedUrl(sesion.audio_path, 3600);
    if (urlData?.signedUrl) sesion._audioUrl = urlData.signedUrl;
  }

  // Detalle pregunta a pregunta del test de comprensión (vive en el .raw.json).
  // Se carga aunque la sesión no tenga audio (p.ej. sin consentimiento de
  // grabación). Es opcional: si falla o la sesión no tenía test, se omite.
  if (sesion.comprension_total > 0) {
    const rawPath = sesion.user_id + "/" + sesion.id + ".raw.json";
    const { data: rurl } = await sb.storage.from("audios").createSignedUrl(rawPath, 3600);
    if (rurl?.signedUrl) {
      try {
        const j = await fetch(rurl.signedUrl).then(r => r.json());
        sesion._comprension = j?.comprension || null;
      } catch (e) { console.warn("No se pudo cargar el detalle de comprensión:", e); }
    }
  }

  render();
}

// ─── Niveles automáticos ─────────────────────────────────────────────────────
function tipoEfectivo(p) { return p.tipo_verificado || p.tipo_ia; }

function nivelPorTasa(count, totalRef) {
  const t = totalRef > 0 ? (count / totalRef) * 100 : 0;
  // Escala UNIFICADA: 3 siempre es lo mejor. Pocos errores por cada 100
  // palabras → 3 (bien); muchos → 1 (a trabajar).
  return t <= 1 ? 3 : t <= 4 ? 2 : 1;
}

// Mediciones reales de ESTA lectura (texto que se muestra bajo cada fila),
// independientes de si el nivel viene autocalculado o ya guardado.
function calcularMedidas() {
  const totalRef = palabras.filter(p => p.idx >= 0 && tipoEfectivo(p) !== "no_leida").length || 1;
  const cuenta = t => palabras.filter(p => tipoEfectivo(p) === t).length;
  const objetivo = OBJETIVOS_PPM[sesion.curso] || 90;
  const pctPpm = sesion.ppm ? Math.round((sesion.ppm / objetivo) * 100) : 0;
  const m = c => `${c} ${c === 1 ? "vez" : "veces"} en ${totalRef} palabras leídas · ${(totalRef > 0 ? c / totalRef * 100 : 0).toFixed(1)} por cada 100`;
  medidas = {
    velocidad:     `${sesion.ppm != null ? sesion.ppm : "—"} PPM · objetivo del curso ${objetivo} (${pctPpm}%)`,
    vacilacion:    m(cuenta("vacilacion")),
    rectificacion: m(cuenta("rectificacion")),
    repeticion:    m(cuenta("repeticion")),
    sustitucion:   m(cuenta("sustitucion")),
    omisiones:     m(cuenta("omision")),
    inversion:     m(cuenta("inversion")),
    adicion:       m(cuenta("adicion"))
  };
  if (sesion.comprension_total > 0) {
    const pct = Math.round(sesion.comprension_aciertos / sesion.comprension_total * 100);
    medidas.comprension = `${sesion.comprension_aciertos} de ${sesion.comprension_total} preguntas acertadas · ${pct}%`;
  }
}

function calcularNivelesAuto() {
  const totalRef = palabras.filter(p => p.idx >= 0 && tipoEfectivo(p) !== "no_leida").length || 1;
  const cuenta = t => palabras.filter(p => tipoEfectivo(p) === t).length;
  const objetivo = OBJETIVOS_PPM[sesion.curso] || 90;
  const pctPpm = sesion.ppm ? (sesion.ppm / objetivo) * 100 : 0;

  const auto = {
    velocidad:         pctPpm >= 100 ? 3 : pctPpm >= 80 ? 2 : 1,
    pausas_entonacion: sesion.prosody >= 75 ? 3 : sesion.prosody >= 50 ? 2 : sesion.prosody ? 1 : 2,
    vacilacion:        nivelPorTasa(cuenta("vacilacion"), totalRef),
    rectificacion:     nivelPorTasa(cuenta("rectificacion"), totalRef),
    repeticion:        nivelPorTasa(cuenta("repeticion"), totalRef),
    sustitucion:       nivelPorTasa(cuenta("sustitucion"), totalRef),
    omisiones:         nivelPorTasa(cuenta("omision"), totalRef),
    inversion:         nivelPorTasa(cuenta("inversion"), totalRef),
    adicion:           nivelPorTasa(cuenta("adicion"), totalRef)
  };
  // Comprensión: se deriva del test respondido por el alumno (si lo hubo).
  // ≥80% aciertos → En nivel · 50-79% → Reforzar · <50% → Requiere trabajo.
  if (sesion.comprension_total > 0) {
    const pctC = sesion.comprension_aciertos / sesion.comprension_total * 100;
    auto.comprension = pctC >= 80 ? 3 : pctC >= 50 ? 2 : 1;
  }
  // No pisar lo que el docente ya tocó ni lo guardado previamente
  Object.entries(auto).forEach(([k, v]) => { if (!nivelesTocados.has(k)) niveles[k] = v; });
}

// ─── Tarjeta con el detalle del test de comprensión ──────────────────────────
function escaparHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function renderComprensionCard() {
  const total = sesion.comprension_total;
  if (!(total > 0)) return "";
  const aciertos = sesion.comprension_aciertos;
  const c = sesion._comprension;
  let filas;
  if (c && Array.isArray(c.respuestas) && c.respuestas.length) {
    filas = c.respuestas.map((r, i) => `
      <div class="comp-item ${r.acierto ? "ok" : "ko"}">
        <div class="comp-icon">${r.acierto ? "✓" : "✗"}</div>
        <div class="comp-txt">
          <div class="comp-p">${i + 1}. ${escaparHtml(r.p)}</div>
          <div class="comp-resp">Respondió: <b>${escaparHtml(r.elegida)}</b></div>
          ${r.acierto ? "" : `<div class="comp-corr">Correcta: ${escaparHtml(r.correcta)}</div>`}
        </div>
      </div>`).join("");
  } else {
    filas = `<div class="nota">Sin el desglose de preguntas para esta sesión.</div>`;
  }
  return `
    <div class="card">
      <div class="card-title">🧠 Comprensión lectora — ${aciertos} de ${total} correctas</div>
      ${filas}
    </div>`;
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  leyExpSel = null;   // el DOM se reconstruye: la explicación arranca cerrada
  calcularMedidas();  // siempre: la medición real se muestra aunque los niveles vengan guardados
  if (sesion.niveles && Object.keys(sesion.niveles).length > 0 && !hayCambios) {
    niveles = { ...sesion.niveles };
    Object.keys(niveles).forEach(k => nivelesTocados.add(k));
  } else {
    calcularNivelesAuto();
  }

  const ini = (sesion.alumno_nombre || "?").split(" ").map(n => n[0]).filter(Boolean).join("").substring(0,2).toUpperCase();
  const fecha = new Date(sesion.fecha).toLocaleDateString("es-ES");
  const errores = palabras.filter(p => !["correcta","no_leida","omision_dudosa"].includes(tipoEfectivo(p))).length;

  document.getElementById("contenido").innerHTML = `
    <div class="layout">
      <div>
        <div class="card">
          <div class="sesion-head">
            <div class="avatar">${ini}</div>
            <div style="flex:1">
              <div class="sesion-nombre">${escaparHtml(sesion.alumno_nombre)}</div>
              <div class="sesion-meta">${escaparHtml(sesion.curso)} · «${escaparHtml(sesion.texto_titulo || sesion.texto_id)}» · ${fecha}</div>
            </div>
            <span class="chip">${sesion.ppm || "—"} PPM</span>
            <span class="chip">${sesion.precision != null ? sesion.precision + "%" : "—"} precisión</span>
            <span class="chip">${errores} marcas</span>
          </div>
          ${sesion._audioUrl
            ? `<audio id="audio" controls src="${sesion._audioUrl}"></audio>`
            : `<div class="nota">Sin audio guardado en esta sesión (sin consentimiento de grabación o fallo al subirlo) — la verificación se hace de memoria.</div>`}
        </div>
        <div class="card">
          <div class="card-title">Lectura — pulsa cualquier palabra para escucharla o corregir su marca</div>
          <div class="reading" id="reading"></div>
          <div class="leyenda-tit">Tipos de marca — pulsa una para ver qué es</div>
          <div class="leyenda">
            ${LEYENDA.map(l => `<button class="ley-item" data-tipo="${l.tipo}" onclick="explicarError('${l.tipo}')"><span class="ley-dot" style="background:${l.color}"></span>${TIPOS[l.tipo].label}</button>`).join("")}
          </div>
          <div class="ley-exp" id="ley-exp"></div>
        </div>
        ${renderComprensionCard()}
      </div>
      <div>
        <div class="card">
          <div class="card-title">📋 Hoja de registro</div>
          <div class="nota" style="margin:0 0 12px">Cada fila se valora en tres niveles: <b style="color:#791F1F">Requiere trabajo</b> · <b style="color:#633806">Reforzar</b> · <b style="color:#0F6E56">En nivel</b>.
          La IA propone uno según los datos de la lectura (lo ves bajo cada fila) y <b>tú lo confirmas o lo cambias con un clic</b>.
          Pulsa la <b>ⓘ</b> de cada fila para ver cómo se decide. Silabeo y rotación las valoras tú por observación directa; la comprensión se calcula con las preguntas de la lectura (cuando las hay).</div>
          <div id="hoja"></div>
          <button class="btn-guardar" id="btn-guardar" onclick="guardarVerificacion()">💾 Guardar verificación</button>
          <div class="guardado-ok" id="guardado-ok">✓ Verificación guardada — esta sesión pasa al dataset</div>
        </div>
      </div>
    </div>`;

  audioEl = document.getElementById("audio");
  renderPalabras();
  renderHoja();
}

function renderPalabras() {
  const cont = document.getElementById("reading");
  cont.innerHTML = "";
  palabras.forEach((p, i) => {
    const t = tipoEfectivo(p);
    const span = document.createElement("span");
    span.className = "word " + (TIPOS[t]?.cls || "");
    if (p.tipo_verificado && p.tipo_verificado !== p.tipo_ia) span.classList.add("editada");
    span.textContent = (p.idx >= 0 ? p.palabra_ref : p.palabra_dicha) + " ";
    span.onclick = ev => abrirMenu(ev, i);
    cont.appendChild(span);
  });
}

function renderHoja() {
  document.getElementById("hoja").innerHTML = DIMENSIONES.map(g => `
    <div class="grupo">
      <div class="grupo-nombre">${g.grupo}</div>
      ${g.items.map(d => {
        const val = niveles[d.key] || null;
        const medida = medidas[d.key];
        return `
        <div class="dim-fila">
          <div class="dim-cab">
            <span class="dim-label">${d.label}</span>
            <button class="dim-ayuda" onclick="toggleCriterio('${d.key}')" title="Cómo se decide este nivel">ⓘ</button>
          </div>
          ${medida ? `<div class="dim-medida">${medida}</div>`
                   : (d.sub ? `<div class="dim-sub">${d.sub}</div>` : "")}
          <div class="dim-criterio" id="crit-${d.key}" style="display:none">${COMO_SE_MIDE[d.key] || CRIT_ERROR}</div>
          <div class="niveles-lbl">
            ${[1,2,3].map(n => {
              // 1 Requiere trabajo (rojo) · 2 Reforzar (ámbar) · 3 En nivel (verde)
              const info = NIVEL_INFO[n];
              const activo = val === n ? `activo ${info.cls}` : "";
              return `<button class="nivel-lbl ${activo}" onclick="setNivel('${d.key}', ${n})">${info.label}</button>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");
}

function setNivel(key, n) {
  niveles[key] = (niveles[key] === n) ? null : n;
  nivelesTocados.add(key);
  hayCambios = true;
  renderHoja();
}

// Despliega/oculta el criterio de una fila (cómo se decide su nivel)
function toggleCriterio(key) {
  const el = document.getElementById("crit-" + key);
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}

// ─── Leyenda: explicar un tipo de error al pulsarlo ──────────────────────────
// El cuadro se queda abierto hasta que se cierra con la × o pulsando fuera.
function explicarError(tipo) {
  leyExpSel = tipo;
  document.querySelectorAll(".ley-item").forEach(b => b.classList.toggle("sel", b.dataset.tipo === tipo));
  const l = LEYENDA.find(x => x.tipo === tipo);
  const box = document.getElementById("ley-exp");
  box.style.borderLeftColor = l.color;
  box.innerHTML = `
    <button class="ley-exp-close" onclick="cerrarExplicacion()" aria-label="Cerrar">×</button>
    <div class="ley-exp-cab"><span class="ley-exp-dot" style="background:${l.color}"></span><b>${TIPOS[tipo].label}</b></div>
    <div class="ley-exp-def">${l.def}</div>
    <div class="ley-exp-ej"><span class="ej-lab">Ejemplo:</span>${l.ej}</div>`;
  box.classList.add("show");
}

function cerrarExplicacion() {
  leyExpSel = null;
  const box = document.getElementById("ley-exp");
  if (box) box.classList.remove("show");
  document.querySelectorAll(".ley-item").forEach(b => b.classList.remove("sel"));
}

// Cerrar el cuadro al pulsar fuera de él (y fuera de los chips de la leyenda)
document.addEventListener("click", ev => {
  if (leyExpSel && !ev.target.closest(".ley-item") && !ev.target.closest("#ley-exp")) {
    cerrarExplicacion();
  }
});

// ─── Menú de corrección por palabra ──────────────────────────────────────────
function abrirMenu(ev, i) {
  ev.stopPropagation();
  seleccionada = i;
  const p = palabras[i];
  const t = tipoEfectivo(p);
  const menu = document.getElementById("menu");

  document.getElementById("menu-word").textContent = p.idx >= 0 ? p.palabra_ref : p.palabra_dicha;
  const dicho = (p.palabra_dicha && p.idx >= 0 && p.palabra_dicha !== p.palabra_ref) ? ` · dijo «${p.palabra_dicha}»` : "";
  document.getElementById("menu-sub").textContent = "IA: " + (TIPOS[p.tipo_ia]?.label || p.tipo_ia) + dicho;

  const puedeEscuchar = audioEl && momentoDe(i) != null;
  document.getElementById("menu-play").disabled = !puedeEscuchar;

  document.getElementById("menu-opts").innerHTML = Object.entries(TIPOS)
    .filter(([k, v]) => v.asignable && (k !== "adicion" || p.idx < 0))
    .map(([k, v]) => `<button class="opt ${t === k ? "activa" : ""}" onclick="setTipo(${i}, '${k}')">${v.label}</button>`)
    .join("");

  menu.classList.add("show");
  const r = ev.target.getBoundingClientRect();
  menu.style.left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 270) + "px";
  menu.style.top = (r.bottom + window.scrollY + 6) + "px";
}
document.addEventListener("click", () => document.getElementById("menu").classList.remove("show"));
document.getElementById("menu").addEventListener("click", ev => ev.stopPropagation());

function setTipo(i, tipo) {
  const p = palabras[i];
  p.tipo_verificado = tipo;
  p._dirty = true;
  hayCambios = true;
  calcularNivelesAuto();
  renderPalabras();
  renderHoja();
  document.getElementById("menu").classList.remove("show");
}

// ─── Escuchar el momento de una palabra ──────────────────────────────────────
// Para omisiones (sin audio propio) se toma la palabra dicha anterior.
function momentoDe(i) {
  for (let k = i; k >= 0; k--) {
    if (palabras[k].offset_ms != null) {
      return { off: palabras[k].offset_ms, dur: palabras[k].duracion_ms || 400 };
    }
  }
  return null;
}

let paradaTimer = null;
function reproducirSeleccion() {
  if (seleccionada == null || !audioEl) return;
  const m = momentoDe(seleccionada);
  if (!m) return;
  // Margen de -0.6s: la grabación empieza un poco antes que el reconocedor
  audioEl.currentTime = Math.max(0, (m.off - 600) / 1000);
  audioEl.play();
  const finEn = (m.off + m.dur + 900) / 1000;
  clearInterval(paradaTimer);
  paradaTimer = setInterval(() => {
    if (audioEl.currentTime >= finEn || audioEl.paused) { audioEl.pause(); clearInterval(paradaTimer); }
  }, 100);
}

// ─── Guardar ─────────────────────────────────────────────────────────────────
// OJO: supabase-js no lanza excepciones, devuelve {error} — se comprueba a mano.
async function guardarVerificacion() {
  const btn = document.getElementById("btn-guardar");
  btn.disabled = true; btn.textContent = "Guardando...";

  let fallos = 0;
  for (const p of palabras.filter(x => x._dirty)) {
    const { error } = await sb.from("sesion_palabras")
      .update({ tipo_verificado: p.tipo_verificado }).eq("id", p.id);
    if (error) { console.error("Error guardando palabra:", error); fallos++; }
    else p._dirty = false;
  }

  const { error: eSes } = await sb.from("sesiones")
    .update({ niveles: niveles, estado: "verificada" }).eq("id", sesionId);
  if (eSes) { console.error("Error guardando niveles:", eSes); fallos++; }

  btn.disabled = false;
  btn.textContent = "💾 Guardar verificación";
  if (fallos === 0) {
    document.getElementById("guardado-ok").classList.add("show");
    hayCambios = false;
  } else {
    alert("Hubo " + fallos + " error(es) al guardar. Revisa la conexión e inténtalo de nuevo.");
  }
}

init();
</script>
