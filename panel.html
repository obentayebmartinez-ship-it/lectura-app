<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LectorIA — Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f0; padding: 1.5rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; }
    .brand-name { font-size: 16px; font-weight: 500; color: #111; }
    .user-info { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .btn-logout { font-size: 12px; padding: 6px 14px; border-radius: 8px; border: 0.5px solid #e5e7eb; background: #fff; color: #374151; cursor: pointer; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
    .card { background: #fff; border-radius: 14px; padding: 1.25rem; border: 0.5px solid #e5e7eb; }
    .metric-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
    .metric-value { font-size: 26px; font-weight: 500; color: #111; }
    .metric-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .card-title { font-size: 14px; font-weight: 500; color: #111; margin-bottom: 1rem; }
    .add-alumno { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .add-alumno input, .add-alumno select { padding: 8px 12px; border-radius: 8px; border: 0.5px solid #e5e7eb; font-size: 13px; flex: 1; min-width: 120px; color: #111; outline: none; }
    .add-alumno input:focus, .add-alumno select:focus { border-color: #1D9E75; }
    .btn-add { padding: 8px 16px; border-radius: 8px; border: none; background: #1D9E75; color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .alumno-fila { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #f3f4f6; font-size: 13px; }
    .alumno-fila:last-child { border-bottom: none; }
    .alumno-nombre { font-weight: 500; color: #111; }
    .alumno-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .alumno-derecha { display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .badge-ok { background: #E1F5EE; color: #0F6E56; }
    .badge-warn { background: #FAEEDA; color: #633806; }
    .badge-bad { background: #FCEBEB; color: #791F1F; }
    .btn-leer { font-size: 11px; padding: 5px 12px; border-radius: 8px; border: none; background: #1D9E75; color: #fff; cursor: pointer; }
    .btn-pdf { font-size: 11px; padding: 5px 10px; border-radius: 8px; border: 0.5px solid #e5e7eb; background: #fff; color: #374151; cursor: pointer; }
    .error-fila { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid #f3f4f6; font-size: 13px; color: #374151; }
    .error-fila:last-child { border-bottom: none; }
    .barra-wrap { background: #f3f4f6; border-radius: 4px; height: 6px; width: 100px; overflow: hidden; }
    .barra-fill { height: 100%; border-radius: 4px; }
    .loading { text-align: center; color: #9ca3af; font-size: 13px; padding: 2rem; }
    @media (max-width: 700px) { .grid-4 { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">LectorIA</span>
    </div>
    <div class="user-info" id="user-email">Cargando...</div>
  </div>
  <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<div class="grid-4">
  <div class="card">
    <div class="metric-label">PPM medio clase</div>
    <div class="metric-value" id="ppm-medio">—</div>
    <div class="metric-sub">palabras por minuto</div>
  </div>
  <div class="card">
    <div class="metric-label">Precisión media</div>
    <div class="metric-value" id="prec-media">—</div>
    <div class="metric-sub">% de acierto</div>
  </div>
  <div class="card">
    <div class="metric-label">Total sesiones</div>
    <div class="metric-value" id="total-sesiones">—</div>
    <div class="metric-sub">lecturas completadas</div>
  </div>
  <div class="card">
    <div class="metric-label">Alumnos activos</div>
    <div class="metric-value" id="alumnos-activos">—</div>
    <div class="metric-sub">han leído al menos 1 vez</div>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Mis alumnos</div>
    <div class="add-alumno">
      <input type="text" id="nuevo-nombre" placeholder="Nombre del alumno" />
      <select id="nuevo-curso">
        <option value="1P">1º Primaria</option>
        <option value="2P" selected>2º Primaria</option>
        <option value="3P">3º Primaria</option>
        <option value="4P">4º Primaria</option>
        <option value="5P">5º Primaria</option>
        <option value="6P">6º Primaria</option>
      </select>
      <button class="btn-add" onclick="añadirAlumno()">+ Añadir</button>
    </div>
    <div id="lista-mis-alumnos"><div class="loading">Cargando alumnos...</div></div>
  </div>
  <div class="card">
    <div class="card-title">Evolución PPM de la clase</div>
    <canvas id="chartPPM" height="220"></canvas>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Últimas sesiones</div>
    <div id="lista-alumnos"><div class="loading">Cargando...</div></div>
  </div>
  <div class="card">
    <div class="card-title">Tipos de errores acumulados</div>
    <div id="lista-errores"><div class="loading">Cargando...</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://mvwuyxrlkyikfgxzokxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_SNSZe5l2R3jcxiHxcxEqgg_XBrW-Xvi";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let todosLosDatos = [];
let sesionUsuario = null;

async function init() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = "login.html"; return; }
  sesionUsuario = data.session.user;
  document.getElementById("user-email").textContent = sesionUsuario.user_metadata?.nombre || sesionUsuario.email;
  await cargarAlumnos();
  await cargarDatos();
}

async function cerrarSesion() {
  await sb.auth.signOut();
  window.location.href = "login.html";
}

async function añadirAlumno() {
  const nombre = document.getElementById("nuevo-nombre").value.trim();
  const curso = document.getElementById("nuevo-curso").value;
  if (!nombre) { alert("Introduce el nombre del alumno"); return; }
  const { error } = await sb.from("alumnos").insert({ nombre, curso, user_id: sesionUsuario.id });
  if (error) { alert("Error al añadir alumno"); return; }
  document.getElementById("nuevo-nombre").value = "";
  await cargarAlumnos();
}

async function cargarAlumnos() {
  const { data } = await sb.from("alumnos").select("*").eq("user_id", sesionUsuario.id).order("nombre");
  const lista = document.getElementById("lista-mis-alumnos");
  if (!data || data.length === 0) {
    lista.innerHTML = "<div class='loading'>Aún no has añadido alumnos</div>";
    return;
  }
  lista.innerHTML = data.map(a => `
    <div class="alumno-fila">
      <div>
        <div class="alumno-nombre">${a.nombre}</div>
        <div class="alumno-meta">${a.curso}</div>
      </div>
      <div class="alumno-derecha">
        <button class="btn-leer" onclick="irALectura('${a.nombre}', '${a.curso}')">▶ Leer</button>
      </div>
    </div>`).join("");
}

function irALectura(nombre, curso) {
  localStorage.setItem("alumno_nombre", nombre);
  localStorage.setItem("alumno_curso", curso);
  window.location.href = "index.html";
}

async function cargarDatos() {
  const { data, error } = await sb.from("sesiones").select("*").order("fecha", { ascending: true });
  if (error || !data || data.length === 0) {
    document.getElementById("lista-alumnos").innerHTML = "<div class='loading'>No hay sesiones todavía</div>";
    document.getElementById("lista-errores").innerHTML = "<div class='loading'>No hay datos todavía</div>";
    return;
  }
  todosLosDatos = data;

  const ppmMedio = Math.round(data.reduce((s, r) => s + r.ppm, 0) / data.length);
  const precMedia = Math.round(data.reduce((s, r) => s + r.precision, 0) / data.length);
  const alumnos = [...new Set(data.map(r => r.alumno))];
  document.getElementById("ppm-medio").textContent = ppmMedio;
  document.getElementById("prec-media").textContent = precMedia + "%";
  document.getElementById("total-sesiones").textContent = data.length;
  document.getElementById("alumnos-activos").textContent = alumnos.length;

  const labels = data.map(r => new Date(r.fecha).toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" }));
  new Chart(document.getElementById("chartPPM"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: data.map(r => r.ppm),
        borderColor: "#1D9E75",
        backgroundColor: "rgba(29,158,117,0.08)",
        borderWidth: 2,
        pointRadius: 3,
        fill: true,
        tension: 0.35
      }, {
        data: Array(labels.length).fill(90),
        borderColor: "#d1d5db",
        borderWidth: 1.5,
        borderDash: [5, 4],
        pointRadius: 0,
        fill: false
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 40, max: 140, ticks: { font: { size: 11 }, color: "#9ca3af" }, grid: { color: "rgba(0,0,0,0.04)" } },
        x: { ticks: { font: { size: 11 }, color: "#9ca3af" }, grid: { display: false } }
      }
    }
  });

  const ultimasSesiones = {};
  data.forEach(r => { ultimasSesiones[r.alumno] = r; });
  document.getElementById("lista-alumnos").innerHTML = Object.values(ultimasSesiones).map(r => {
    const badge = r.ppm >= 90 ? "badge-ok" : r.ppm >= 70 ? "badge-warn" : "badge-bad";
    const texto = r.ppm >= 90 ? "En nivel" : r.ppm >= 70 ? "Cerca" : "Necesita apoyo";
    return `
      <div class="alumno-fila">
        <div>
          <div class="alumno-nombre">${r.alumno}</div>
          <div class="alumno-meta">${r.ppm} PPM · ${r.precision}% precisión</div>
        </div>
        <div class="alumno-derecha">
          <span class="badge ${badge}">${texto}</span>
          <button class="btn-pdf" onclick="generarPDF('${r.alumno}')">📄 PDF</button>
        </div>
      </div>`;
  }).join("");

  const tO = data.reduce((s, r) => s + r.omisiones, 0);
  const tS = data.reduce((s, r) => s + r.sustituciones, 0);
  const tR = data.reduce((s, r) => s + r.repeticiones, 0);
  const tV = data.reduce((s, r) => s + (r.vacilaciones || 0), 0);
  const tTotal = tO + tS + tR + tV || 1;
  document.getElementById("lista-errores").innerHTML = [
    { label: "Omisiones", val: tO, color: "#F09595" },
    { label: "Sustituciones", val: tS, color: "#EF9F27" },
    { label: "Repeticiones", val: tR, color: "#AFA9EC" },
    { label: "Vacilaciones", val: tV, color: "#5DCAA5" }
  ].map(e => `
    <div class="error-fila">
      <span>${e.label}</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="barra-wrap"><div class="barra-fill" style="width:${Math.round((e.val/tTotal)*100)}%;background:${e.color}"></div></div>
        <span style="font-size:12px;color:#9ca3af;min-width:20px;text-align:right">${e.val}</span>
      </div>
    </div>`).join("");
}

function generarPDF(nombreAlumno) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const sesiones = todosLosDatos.filter(r => r.alumno === nombreAlumno);
  const ultima = sesiones[sesiones.length - 1];
  const fecha = new Date().toLocaleDateString("es-ES");
  const objetivo = 90;
  const estado = ultima.ppm >= objetivo ? "En nivel" : ultima.ppm >= 70 ? "Cerca del nivel" : "Necesita apoyo";
  const recomendacion = ultima.ppm >= objetivo
    ? "El alumno ha alcanzado el nivel esperado. Se recomienda mantener la práctica diaria y avanzar a textos de mayor complejidad."
    : ultima.ppm >= 70
    ? "El alumno está cerca del objetivo. Se recomienda práctica diaria de 10 minutos con lecturas de su nivel actual."
    : "El alumno necesita apoyo adicional. Se recomienda sesiones de lectura guiada y revisión con el orientador educativo.";

  doc.setFillColor(29, 158, 117);
  doc.rect(0, 0, 210, 28, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(18); doc.setFont("helvetica", "bold");
  doc.text("LectorIA", 14, 12);
  doc.setFontSize(11); doc.setFont("helvetica", "normal");
  doc.text("Informe de velocidad lectora", 14, 21);
  doc.text(fecha, 196, 21, { align: "right" });
  doc.setTextColor(17, 17, 17);
  doc.setFontSize(16); doc.setFont("helvetica", "bold");
  doc.text(nombreAlumno, 14, 42);
  doc.setFontSize(11); doc.setFont("helvetica", "normal");
  doc.setTextColor(107, 114, 128);
  doc.text(`${sesiones.length} sesión(es) completada(s)`, 14, 50);
  doc.setFillColor(249, 250, 251);
  doc.roundedRect(14, 58, 85, 30, 3, 3, "F");
  doc.roundedRect(111, 58, 85, 30, 3, 3, "F");
  doc.setTextColor(107, 114, 128); doc.setFontSize(9);
  doc.text("PPM ACTUAL", 20, 66);
  doc.text("OBJETIVO CURSO", 117, 66);
  doc.setTextColor(17, 17, 17); doc.setFontSize(24); doc.setFont("helvetica", "bold");
  doc.text(String(ultima.ppm), 20, 82);
  doc.text(String(objetivo), 117, 82);
  doc.setFontSize(10); doc.setFont("helvetica", "normal");
  const estadoColor = ultima.ppm >= objetivo ? [15, 110, 86] : ultima.ppm >= 70 ? [133, 77, 14] : [121, 31, 31];
  doc.setTextColor(...estadoColor);
  doc.text(`Estado: ${estado}`, 14, 100);
  doc.setDrawColor(229, 231, 235); doc.line(14, 106, 196, 106);
  doc.setTextColor(17, 17, 17); doc.setFontSize(12); doc.setFont("helvetica", "bold");
  doc.text("Detalle de errores", 14, 116);
  [
    { label: "Omisiones", valor: ultima.omisiones },
    { label: "Sustituciones", valor: ultima.sustituciones },
    { label: "Repeticiones", valor: ultima.repeticiones },
    { label: "Vacilaciones", valor: ultima.vacilaciones || 0 }
  ].forEach((e, i) => {
    const y = 126 + i * 12;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(55, 65, 81);
    doc.text(e.label, 14, y);
    doc.setTextColor(17, 17, 17); doc.setFont("helvetica", "bold");
    doc.text(String(e.valor), 80, y);
  });
  doc.setFont("helvetica", "normal");
  doc.setFillColor(240, 253, 244);
  doc.roundedRect(14, 178, 182, 28, 3, 3, "F");
  doc.setTextColor(15, 110, 86); doc.setFontSize(10); doc.setFont("helvetica", "bold");
  doc.text("Recomendación", 20, 188);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text(doc.splitTextToSize(recomendacion, 170), 20, 196);
  doc.setTextColor(156, 163, 175); doc.setFontSize(8);
  doc.text("Generado por LectorIA · Plataforma de estimulación lectora", 105, 285, { align: "center" });
  doc.save(`informe_${nombreAlumno.replace(/ /g,"_")}_${fecha.replace(/\//g,"-")}.pdf`);
}

init();
</script>
</body>
</html>
